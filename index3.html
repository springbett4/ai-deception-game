<!DOCTYPE html>
<html lang="en" data-theme="light">

<title>AI or Not? A Class Interview Quiz</title>
<style>
  /* Plain, generic-quiz-site palette. No thematic gradients/glow - just a
     light and a dark variant of the same flat layout. Values are tuned so
     every text/background pairing clears WCAG AA (>=4.5:1) in both modes. */
  :root, html[data-theme="light"] {
    --bg-page-a: #f7f8fa;
    --bg-page-b: #eef0f3;
    --dot-color: rgba(0, 0, 0, 0.05);
    --bg-card: #ffffff;
    --text-primary: #1f2328;
    --text-heading: #111827;
    --text-muted: #6b7280;
    --border: #e2e5e9;
    --input-border: #d1d5db;
    --divider: #eceff2;
    --surface-muted: #f9fafb;
    --surface-muted-border: #e5e7eb;
    --option-hover-bg: #f3f4f6;
    --option-hover-border: #c0c5cc;
    --selected-bg: #eaf2ff;
    --selected-text: #1d4ed8;
    --success: #15803d;
    --danger: #dc2626;
    --disabled-bg: #9ca3af;
    --card-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
  }

  html[data-theme="dark"] {
    --bg-page-a: #1c1e23;
    --bg-page-b: #121317;
    --dot-color: rgba(255, 255, 255, 0.045);
    --bg-card: #1f2229;
    --text-primary: #e5e7eb;
    --text-heading: #f3f4f6;
    --text-muted: #9aa1ab;
    --border: #33373f;
    --input-border: #454b55;
    --divider: #2b2f37;
    --surface-muted: #2a2e35;
    --surface-muted-border: #383d46;
    --option-hover-bg: #262a31;
    --option-hover-border: #4a505a;
    --selected-bg: #16233d;
    --selected-text: #8ab4ff;
    --success: #4ade80;
    --danger: #f87171;
    --disabled-bg: #454b55;
    --card-shadow: 0 1px 4px rgba(0, 0, 0, 0.4);
  }

  /* Accent blue stays the same brand color in both themes; only surfaces,
     text, and borders shift between light and dark. */
  :root {
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --accent-text: #ffffff;
  }

  * { box-sizing: border-box; }

  html { transition: background-color 0.2s ease; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(var(--dot-color) 1px, transparent 1px),
      linear-gradient(160deg, var(--bg-page-a) 0%, var(--bg-page-b) 100%);
    background-size: 22px 22px, 100% 100%;
    background-attachment: fixed;
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  .toolbar {
    position: fixed;
    top: 16px;
    right: 16px;
    z-index: 10;
  }
  .theme-toggle-btn {
    width: 38px;
    height: 38px;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg-card);
    border: 1px solid var(--input-border);
    border-radius: 50%;
    cursor: pointer;
    box-shadow: var(--card-shadow);
  }
  .theme-toggle-btn:hover { border-color: var(--accent); }
  .theme-toggle-btn svg { width: 18px; height: 18px; }

  .quiz-container {
    max-width: 640px;
    margin: 40px auto;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 32px;
    box-shadow: var(--card-shadow);
  }

  h1 {
    font-size: 20px;
    margin: 0 0 24px;
    text-align: center;
    color: var(--text-heading);
  }

  .progress-wrap { margin-bottom: 24px; }
  .progress-label {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .progress-bar-track {
    height: 8px;
    background: var(--divider);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.2s ease;
  }

  .q-student-tag {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 4px;
  }
  .q-title {
    font-size: 19px;
    font-weight: 600;
    margin: 0 0 20px;
    color: var(--text-heading);
  }

  .avatar {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: 700;
    color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .avatar-lg { width: 34px; height: 34px; font-size: 13px; }

  .option-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 24px;
  }
  .option-btn {
    text-align: left;
    padding: 12px 16px;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background: var(--bg-card);
    font-size: 15px;
    color: var(--text-primary);
    cursor: pointer;
    font-family: inherit;
  }
  .option-btn:hover { background: var(--option-hover-bg); border-color: var(--option-hover-border); }
  .option-btn.selected {
    background: var(--selected-bg);
    border-color: var(--accent);
    color: var(--selected-text);
    font-weight: 500;
  }

  .primary-btn {
    padding: 10px 22px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
  }
  .primary-btn:hover { background: var(--accent-hover); }
  .primary-btn:disabled { background: var(--disabled-bg); cursor: not-allowed; }

  .secondary-btn {
    padding: 10px 22px;
    background: var(--bg-card);
    color: var(--text-primary);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    font-family: inherit;
    margin-right: 10px;
  }
  .secondary-btn:hover { background: var(--option-hover-bg); border-color: var(--option-hover-border); }

  .btn-row { text-align: right; }
  .btn-row.center { text-align: center; }

  .reveal-tag {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 6px;
  }
  .reveal-answer {
    font-size: 15px;
    line-height: 1.6;
    padding: 16px;
    background: var(--surface-muted);
    border: 1px solid var(--surface-muted-border);
    border-radius: 6px;
    margin-bottom: 20px;
  }

  .intro-text { font-size: 15px; color: var(--text-primary); margin-bottom: 24px; }

  .guess-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 14px 0;
    border-bottom: 1px solid var(--divider);
  }
  .guess-name-row { display: flex; align-items: center; gap: 8px; }
  .guess-name { font-size: 15px; font-weight: 500; color: var(--text-heading); }
  .guess-class { font-size: 13px; color: var(--text-muted); font-weight: 400; }
  .guess-toggle { display: flex; gap: 8px; flex: 0 0 auto; }
  .toggle-btn {
    padding: 8px 14px;
    border: 1px solid var(--input-border);
    border-radius: 6px;
    background: var(--bg-card);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    color: var(--text-primary);
  }
  .toggle-btn:hover { background: var(--option-hover-bg); }
  .toggle-btn.selected { background: var(--accent); border-color: var(--accent); color: var(--accent-text); }

  .guess-note { font-size: 13px; color: var(--text-muted); text-align: center; margin-top: 16px; }

  .score-banner {
    text-align: center;
    font-size: 30px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--text-heading);
  }
  .verdict-text {
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 28px;
    font-size: 14px;
  }

  .result-row {
    padding: 14px 0;
    border-bottom: 1px solid var(--divider);
  }
  .result-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .result-name-row { display: flex; align-items: center; gap: 8px; }
  .result-name { font-size: 15px; font-weight: 600; color: var(--text-heading); }
  .result-tag-correct { color: var(--success); font-weight: 600; font-size: 13px; }
  .result-tag-incorrect { color: var(--danger); font-weight: 600; font-size: 13px; }
  .result-detail { font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
  .result-tells { font-size: 13px; color: var(--text-primary); }
  .result-tells ul { margin: 4px 0 0; padding-left: 18px; }
  .result-tells li { margin-bottom: 3px; }

  .review-item {
    padding: 16px 0;
    border-bottom: 1px solid var(--divider);
  }
  .review-item-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .review-name { font-size: 16px; font-weight: 600; color: var(--text-heading); }
  .review-qa { margin-bottom: 10px; }
  .review-q { font-size: 13px; color: var(--text-muted); margin-bottom: 3px; }
  .review-a { font-size: 14px; color: var(--text-primary); line-height: 1.5; }
</style>
</head>

  // -------------------------------------------------------------------------
  // Pure scoring logic - mirrors game.py's evaluate(). Identical to the
  // other two versions.
  // -------------------------------------------------------------------------

  function evaluate(students, guesses) {
    var results = [];
    var correct = 0;

    students.forEach(function (student) {
      var guessedAI = guesses[student.name];
      var actuallyAI = student.isAI;
      var isCorrect = guessedAI === actuallyAI;
      if (isCorrect) correct += 1;

      results.push({
        name: student.name,
        className: student.className,
        actuallyAI: actuallyAI,
        guessedAI: guessedAI,
        correct: isCorrect,
        tells: student.tells
      });
    });

    var total = students.length;
    var verdict;
    if (correct === total) {
      verdict = "Perfect read. Not even the best AI in this class could fool you.";
    } else if (correct >= Math.floor(total / 2) + 1) {
      verdict = "Solid instincts. A few tells slipped past you, though.";
    } else {
      verdict = "The class fooled you more than you fooled them. Sharpen your ear for the tells.";
    }

    return { results: results, correct: correct, total: total, verdict: verdict };
  }

  // -------------------------------------------------------------------------
  // Application state
  // -------------------------------------------------------------------------

  var TOTAL_QUESTIONS = STUDENTS.length * QUESTIONS_PER_STUDENT;

  function freshState() {
    var conversation = {};
    var askedIds = {};
    STUDENTS.forEach(function (s) {
      conversation[s.name] = [];
      askedIds[s.name] = [];
    });
    return {
      phase: "intro",       // intro | interrogate | guessing | reveal
      studentIdx: 0,
      conversation: conversation,
      askedIds: askedIds,
      guesses: {},
      selectedQid: null,     // currently highlighted (not yet confirmed) option
      awaitingContinue: false,
      pendingTurn: null      // { q, a } shown on the reveal sub-screen
    };
  }

  var state = freshState();

  function currentStudent() {
    return STUDENTS[state.studentIdx];
  }

  var app = document.getElementById("app");

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  // -------------------------------------------------------------------------
  // Theme toggle - plain JS variable, not persisted anywhere, so it resets
  // to light mode on every reload.
  // -------------------------------------------------------------------------

  var SUN_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' +
    '<circle cx="12" cy="12" r="4"></circle>' +
    '<line x1="12" y1="2" x2="12" y2="4"></line>' +
    '<line x1="12" y1="20" x2="12" y2="22"></line>' +
    '<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>' +
    '<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>' +
    '<line x1="2" y1="12" x2="4" y2="12"></line>' +
    '<line x1="20" y1="12" x2="22" y2="12"></line>' +
    '<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>' +
    '<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>' +
    '</svg>';

  var MOON_ICON =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
    'stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>' +
    '</svg>';

  var currentTheme = "light";
  var themeToggleBtn = document.getElementById("themeToggleBtn");
  themeToggleBtn.style.color = "var(--text-primary)";

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", currentTheme);
    themeToggleBtn.innerHTML = currentTheme === "light" ? MOON_ICON : SUN_ICON;
  }

  themeToggleBtn.onclick = function () {
    currentTheme = currentTheme === "light" ? "dark" : "light";
    applyTheme();
  };

  applyTheme();

  // -------------------------------------------------------------------------
  // Avatars - flat colored circle + initials, one fixed accent color per
  // student (by position). No external images, no game theming.
  // -------------------------------------------------------------------------

  var AVATAR_COLORS = ["#2e799e", "#a25f2f", "#6234b2", "#257e61", "#b23473", "#3468b2"];

  function initials(name) {
    return name.split(/\s+/).map(function (w) { return w[0]; }).join("").toUpperCase();
  }

  function makeAvatar(index, name, large) {
    var span = document.createElement("span");
    span.className = large ? "avatar avatar-lg" : "avatar";
    span.style.background = AVATAR_COLORS[index % AVATAR_COLORS.length];
    span.textContent = initials(name);
    return span;
  }

  function render() {
    app.innerHTML = "";

    var h1 = document.createElement("h1");
    h1.textContent = "AI or Not? A Class Interview Quiz";
    app.appendChild(h1);

    if (state.phase === "intro") renderIntro();
    else if (state.phase === "interrogate") renderInterrogate();
    else if (state.phase === "guessing") renderGuessing();
    else if (state.phase === "reveal") renderReveal();
    else if (state.phase === "review") renderReview();
  }

  function renderIntro() {
    var p = document.createElement("div");
    p.className = "intro-text";
    p.innerHTML =
      "You'll interview 6 classmates, asking each of them 3 questions. " +
      "Some of them are simple rule-based responders, and some are AI-powered " +
      "and occasionally let their mask slip. Read their answers carefully - " +
      "afterward you'll be asked to guess which ones were AI.";
    app.appendChild(p);

    var row = document.createElement("div");
    row.className = "btn-row center";
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "primary-btn";
    btn.textContent = "Start Quiz";
    btn.onclick = function () {
      state.phase = "interrogate";
      render();
    };
    row.appendChild(btn);
    app.appendChild(row);
  }

  function renderInterrogate() {
    var student = currentStudent();
    var asked = state.askedIds[student.name];
    var stepNumber = state.studentIdx * QUESTIONS_PER_STUDENT + asked.length +
      (state.awaitingContinue ? 0 : 1);
    if (stepNumber > TOTAL_QUESTIONS) stepNumber = TOTAL_QUESTIONS;
    var pct = Math.round((stepNumber / TOTAL_QUESTIONS) * 100);

    var progressWrap = document.createElement("div");
    progressWrap.className = "progress-wrap";
    var progressLabel = document.createElement("div");
    progressLabel.className = "progress-label";
    progressLabel.textContent = "Question " + stepNumber + " of " + TOTAL_QUESTIONS;
    progressWrap.appendChild(progressLabel);
    var track = document.createElement("div");
    track.className = "progress-bar-track";
    var fill = document.createElement("div");
    fill.className = "progress-bar-fill";
    fill.style.width = pct + "%";
    track.appendChild(fill);
    progressWrap.appendChild(track);
    app.appendChild(progressWrap);

    var studentTag = document.createElement("div");
    studentTag.className = "q-student-tag";
    studentTag.appendChild(makeAvatar(state.studentIdx, student.name, false));
    var studentTagText = document.createElement("span");
    studentTagText.textContent = "Interviewing: " + student.name + " (" + student.className + ")";
    studentTag.appendChild(studentTagText);
    app.appendChild(studentTag);

    if (state.awaitingContinue) {
      var revealTitle = document.createElement("div");
      revealTitle.className = "q-title";
      revealTitle.textContent = "Their response:";
      app.appendChild(revealTitle);

      var revealTag = document.createElement("div");
      revealTag.className = "reveal-tag";
      revealTag.textContent = "You asked: " + state.pendingTurn.q;
      app.appendChild(revealTag);

      var answerBox = document.createElement("div");
      answerBox.className = "reveal-answer";
      answerBox.textContent = state.pendingTurn.a;
      app.appendChild(answerBox);

      var row = document.createElement("div");
      row.className = "btn-row";
      var nextBtn = document.createElement("button");
      nextBtn.type = "button";
      nextBtn.className = "primary-btn";
      var isLastQuestionForStudent = asked.length >= QUESTIONS_PER_STUDENT;
      var isLastStudent = state.studentIdx >= STUDENTS.length - 1;
      nextBtn.textContent = "Next";
      nextBtn.onclick = function () {
        state.awaitingContinue = false;
        state.pendingTurn = null;
        if (isLastQuestionForStudent) {
          if (isLastStudent) {
            state.phase = "guessing";
          } else {
            state.studentIdx += 1;
          }
        }
        render();
      };
      row.appendChild(nextBtn);
      app.appendChild(row);
      return;
    }

    var title = document.createElement("div");
    title.className = "q-title";
    title.textContent = "Which question do you want to ask?";
    app.appendChild(title);

    var optionList = document.createElement("div");
    optionList.className = "option-list";

    QUESTION_BANK.forEach(function (pair) {
      var qid = pair[0], qtext = pair[1];
      if (asked.indexOf(qid) !== -1) return;
      var optBtn = document.createElement("button");
      optBtn.type = "button";
      optBtn.className = "option-btn" + (state.selectedQid === qid ? " selected" : "");
      optBtn.textContent = qtext;
      optBtn.onclick = function () {
        state.selectedQid = qid;
        render();
      };
      optionList.appendChild(optBtn);
    });
    app.appendChild(optionList);

    var btnRow = document.createElement("div");
    btnRow.className = "btn-row";
    var nextBtn2 = document.createElement("button");
    nextBtn2.type = "button";
    nextBtn2.className = "primary-btn";
    nextBtn2.textContent = "Next";
    nextBtn2.disabled = !state.selectedQid;
    nextBtn2.onclick = function () {
      if (!state.selectedQid) return;
      var qid = state.selectedQid;
      var qtext = QUESTION_BANK.filter(function (p) { return p[0] === qid; })[0][1];
      var answer = randomChoice(student.responses[qid]);
      state.askedIds[student.name].push(qid);
      state.conversation[student.name].push({ q: qtext, a: answer });
      state.selectedQid = null;
      state.awaitingContinue = true;
      state.pendingTurn = { q: qtext, a: answer };
      render();
    };
    btnRow.appendChild(nextBtn2);
    app.appendChild(btnRow);
  }

  function renderGuessing() {
    var title = document.createElement("div");
    title.className = "q-title";
    title.textContent = "Final section: who was AI?";
    app.appendChild(title);

    var intro = document.createElement("div");
    intro.className = "intro-text";
    intro.textContent = "For each classmate, mark whether you think they were AI-powered or not.";
    app.appendChild(intro);

    STUDENTS.forEach(function (student) {
      var row = document.createElement("div");
      row.className = "guess-row";

      var nameBlock = document.createElement("div");
      nameBlock.innerHTML =
        '<div class="guess-name">' + escapeHtml(student.name) +
        ' <span class="guess-class">(' + escapeHtml(student.className) + ')</span></div>';
      row.appendChild(nameBlock);

      var toggle = document.createElement("div");
      toggle.className = "guess-toggle";
      var currentGuess = state.guesses[student.name];

      var notAiBtn = document.createElement("button");
      notAiBtn.type = "button";
      notAiBtn.className = "toggle-btn" + (currentGuess === false ? " selected" : "");
      notAiBtn.textContent = "Not AI";
      notAiBtn.onclick = function () {
        state.guesses[student.name] = false;
        render();
      };
      toggle.appendChild(notAiBtn);

      var aiBtn = document.createElement("button");
      aiBtn.type = "button";
      aiBtn.className = "toggle-btn" + (currentGuess === true ? " selected" : "");
      aiBtn.textContent = "AI";
      aiBtn.onclick = function () {
        state.guesses[student.name] = true;
        render();
      };
      toggle.appendChild(aiBtn);

      row.appendChild(toggle);
      app.appendChild(row);
    });

    var markedCount = STUDENTS.filter(function (s) {
      return state.guesses.hasOwnProperty(s.name);
    }).length;

    var btnRow = document.createElement("div");
    btnRow.className = "btn-row center";
    btnRow.style.marginTop = "20px";
    var submitBtn = document.createElement("button");
    submitBtn.type = "button";
    submitBtn.className = "primary-btn";
    submitBtn.textContent = "Submit Answers";
    submitBtn.disabled = markedCount < STUDENTS.length;
    submitBtn.onclick = function () {
      if (markedCount < STUDENTS.length) return;
      state.phase = "reveal";
      render();
    };
    btnRow.appendChild(submitBtn);
    app.appendChild(btnRow);

    if (markedCount < STUDENTS.length) {
      var note = document.createElement("div");
      note.className = "guess-note";
      note.textContent = markedCount + " of " + STUDENTS.length + " answered - mark everyone before submitting.";
      app.appendChild(note);
    }
  }

  function renderReveal() {
    var summary = evaluate(STUDENTS, state.guesses);

    var scoreBanner = document.createElement("div");
    scoreBanner.className = "score-banner";
    scoreBanner.textContent = "You scored " + summary.correct + " / " + summary.total;
    app.appendChild(scoreBanner);

    var verdict = document.createElement("div");
    verdict.className = "verdict-text";
    verdict.textContent = summary.verdict;
    app.appendChild(verdict);

    summary.results.forEach(function (result) {
      var row = document.createElement("div");
      row.className = "result-row";

      var head = document.createElement("div");
      head.className = "result-head";
      head.innerHTML =
        '<span class="result-name">' + escapeHtml(result.name) + '</span>' +
        '<span class="' + (result.correct ? "result-tag-correct" : "result-tag-incorrect") + '">' +
        (result.correct ? "Correct" : "Incorrect") + '</span>';
      row.appendChild(head);

      var detail = document.createElement("div");
      detail.className = "result-detail";
      detail.textContent = "Actually: " + (result.actuallyAI ? "AI-powered" : "Not AI") +
        "  |  Your answer: " + (result.guessedAI ? "AI-powered" : "Not AI");
      row.appendChild(detail);

      var tellsBlock = document.createElement("div");
      tellsBlock.className = "result-tells";
      if (result.actuallyAI) {
        var items = result.tells.map(function (t) {
          return "<li>" + escapeHtml(t) + "</li>";
        }).join("");
        tellsBlock.innerHTML = "Tells you could have caught:<ul>" + items + "</ul>";
      } else {
        tellsBlock.textContent = "No red flags - consistent personality, grounded verifiable details.";
      }
      row.appendChild(tellsBlock);

      app.appendChild(row);
    });

    var btnRow = document.createElement("div");
    btnRow.className = "btn-row center";
    btnRow.style.marginTop = "20px";

    var reviewBtn = document.createElement("button");
    reviewBtn.type = "button";
    reviewBtn.className = "secondary-btn";
    reviewBtn.textContent = "Review Answers";
    reviewBtn.onclick = function () {
      state.phase = "review";
      render();
    };
    btnRow.appendChild(reviewBtn);

    var again = document.createElement("button");
    again.type = "button";
    again.className = "primary-btn";
    again.textContent = "Retake Quiz";
    again.onclick = function () {
      state = freshState();
      render();
    };
    btnRow.appendChild(again);
    app.appendChild(btnRow);
  }

  function renderReview() {
    var title = document.createElement("div");
    title.className = "q-title";
    title.textContent = "Review Answers";
    app.appendChild(title);

    var intro = document.createElement("div");
    intro.className = "intro-text";
    intro.textContent = "Every question you asked and how each classmate responded.";
    app.appendChild(intro);

    STUDENTS.forEach(function (student, index) {
      var item = document.createElement("div");
      item.className = "review-item";

      var head = document.createElement("div");
      head.className = "review-item-head";
      head.appendChild(makeAvatar(index, student.name, true));
      var nameBlock = document.createElement("div");
      nameBlock.innerHTML =
        '<div class="review-name">' + escapeHtml(student.name) + '</div>' +
        '<span class="guess-class">' + escapeHtml(student.className) + '</span>';
      head.appendChild(nameBlock);
      item.appendChild(head);

      var convo = state.conversation[student.name];
      convo.forEach(function (turn) {
        var qa = document.createElement("div");
        qa.className = "review-qa";
        qa.innerHTML =
          '<div class="review-q">Q: ' + escapeHtml(turn.q) + '</div>' +
          '<div class="review-a">' + escapeHtml(turn.a) + '</div>';
        item.appendChild(qa);
      });

      app.appendChild(item);
    });

    var btnRow = document.createElement("div");
    btnRow.className = "btn-row center";
    btnRow.style.marginTop = "20px";

    var backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.className = "secondary-btn";
    backBtn.textContent = "Back to Results";
    backBtn.onclick = function () {
      state.phase = "reveal";
      render();
    };
    btnRow.appendChild(backBtn);

    var again = document.createElement("button");
    again.type = "button";
    again.className = "primary-btn";
    again.textContent = "Retake Quiz";
    again.onclick = function () {
      state = freshState();
      render();
    };
    btnRow.appendChild(again);
    app.appendChild(btnRow);
  }

  render();
})();
</script>
