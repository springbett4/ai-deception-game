<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class D Deception</title>
<style>
  /* Colors below are tuned so every foreground/background text pairing in
     this file clears WCAG AA (>=4.5:1) with a margin, in both themes. */
  :root, html[data-theme="dark"] {
    --bg-top: #201f26;
    --bg-bottom: #29272f;
    --ink: #d9d4cd;
    --muted: #9f9991;
    --crimson: #8c4a52;
    --crimson-hover: #9c5b62;
    --gold: #b9a26a;
    --tag-ink: #241f12;
    --btn-ink: #fdf7f0;
    --card: #26252d;
    --card-border: #423f48;
    --log-bg: #1c1b21;
    --log-border: #34313a;
    --green: #7ea788;
    --red: #c08d95;
    --tell: #b99498;
    --overlay: rgba(0, 0, 0, 0.45);
    --btn-hover-bg: #332f39;
  }

  html[data-theme="light"] {
    --bg-top: #f3ede4;
    --bg-bottom: #ece2d4;
    --ink: #3b3530;
    --muted: #625b52;
    --crimson: #9c5b62;
    --crimson-hover: #86494f;
    --gold: #6c5934;
    --tag-ink: #fbf3e4;
    --card: #fbf7f1;
    --card-border: #ddd2c2;
    --log-bg: #f5efe6;
    --log-border: #e2d7c7;
    --green: #44634c;
    --red: #8d464e;
    --tell: #785256;
    --overlay: rgba(60, 50, 40, 0.25);
    --btn-hover-bg: #efe4d2;
  }

  html { transition: background-color 0.2s ease; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--ink);
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 2em 1.2em 4em;
  }

  h1, h2, h3, h4 {
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 0.03em;
  }

  .coe-title {
    text-align: center;
    color: var(--gold);
    letter-spacing: 0.15em;
    border-bottom: 2px solid var(--crimson);
    padding-bottom: 0.4em;
    margin-bottom: 0.8em;
  }

  .coe-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 4px solid var(--crimson);
    border-radius: 6px;
    padding: 1.1em 1.4em;
    margin-bottom: 1em;
  }

  .coe-class-tag {
    display: inline-block;
    color: var(--tag-ink);
    background: var(--gold);
    font-size: 0.75em;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 0.15em 0.6em;
    border-radius: 3px;
    margin-bottom: 0.5em;
  }

  .coe-log {
    background: var(--log-bg);
    border: 1px solid var(--log-border);
    border-radius: 6px;
    padding: 0.9em 1.2em;
    margin-bottom: 0.6em;
  }

  .coe-you { color: var(--gold); font-weight: 600; }
  .coe-them { color: var(--ink); }

  .coe-verdict-correct { color: var(--green); font-weight: 700; }
  .coe-verdict-wrong { color: var(--red); font-weight: 700; }
  .coe-tell { color: var(--tell); }

  .coe-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--crimson);
    border-radius: 4px;
    padding: 0.6em 1em;
    margin-bottom: 0.55em;
    font-size: 0.95em;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
  }
  .coe-btn:hover {
    background: var(--btn-hover-bg);
    border-color: var(--gold);
    color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold);
    cursor: pointer;
  }
  .coe-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .coe-btn-primary {
    background: var(--crimson);
    border-color: var(--crimson);
    color: var(--btn-ink);
    font-weight: 600;
    width: auto;
    display: inline-block;
    padding: 0.6em 1.6em;
  }
  .coe-btn-primary:hover { background: var(--crimson-hover); border-color: var(--gold); color: var(--btn-ink); }

  .coe-progress {
    text-align: center;
    color: var(--muted);
    font-size: 0.85em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.6em;
  }

  .coe-radio-group {
    display: flex;
    gap: 1.2em;
    margin: 0.4em 0 1.1em;
  }
  .coe-radio-group label {
    display: flex;
    align-items: center;
    gap: 0.4em;
    cursor: pointer;
  }

  .coe-verdict-name {
    display: flex;
    align-items: center;
    gap: 0.6em;
    flex-wrap: wrap;
  }

  .coe-summary {
    text-align: center;
    margin-bottom: 1.4em;
  }
  .coe-summary .score {
    font-size: 2.2em;
    color: var(--gold);
    font-family: Georgia, serif;
  }
  .coe-summary .verdict-line {
    font-style: italic;
    color: var(--muted);
  }

  .coe-actions {
    text-align: center;
    margin-top: 1.6em;
  }

  ul.coe-tell-list {
    margin: 0.4em 0 0;
    padding-left: 1.3em;
  }

  /* -------------------------------------------------------------------- */
  /* Toolbar (theme + review toggles) and review drawer                   */
  /* -------------------------------------------------------------------- */

  .coe-toolbar {
    position: fixed;
    top: 0.8em;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    padding: 0 1em;
    z-index: 50;
    pointer-events: none;
  }
  .coe-toolbar > * { pointer-events: auto; }

  .coe-icon-btn {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 0.4em 1em;
    font-size: 0.85em;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  .coe-icon-btn:hover { border-color: var(--gold); color: var(--gold); }

  #app { padding-top: 3.6em; }

  .coe-review-backdrop {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    z-index: 90;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .coe-review-backdrop.open { opacity: 1; pointer-events: auto; }

  .coe-review-panel {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: min(380px, 92vw);
    background: var(--card);
    border-left: 1px solid var(--card-border);
    box-shadow: -8px 0 24px rgba(0, 0, 0, 0.3);
    transform: translateX(100%);
    transition: transform 0.25s ease;
    z-index: 100;
    overflow-y: auto;
    padding: 1.3em 1.3em 2em;
  }
  .coe-review-panel.open { transform: translateX(0); }

  .coe-review-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 0.9em;
  }

  .coe-review-close {
    background: none;
    border: none;
    color: var(--ink);
    font-size: 1.4em;
    line-height: 1;
    cursor: pointer;
    padding: 0.1em 0.3em;
  }
  .coe-review-close:hover { color: var(--gold); }

  .coe-review-empty { color: var(--muted); }

  .coe-chip-btn {
    display: inline-block;
    width: auto;
    background: transparent;
    border: 1px solid var(--card-border);
    color: var(--gold);
    border-radius: 4px;
    padding: 0.35em 0.85em;
    font-size: 0.85em;
    cursor: pointer;
    margin: 0.2em 0 0.6em;
  }
  .coe-chip-btn:hover { border-color: var(--gold); }

  /* -------------------------------------------------------------------- */
  /* Floating navigation aids                                             */
  /* -------------------------------------------------------------------- */

  .coe-floating-btn {
    position: fixed;
    bottom: 1.4em;
    z-index: 60;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    cursor: pointer;
    opacity: 0;
    transform: translateY(0.6em);
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease, background 0.15s, border-color 0.15s;
  }
  .coe-floating-btn.visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .coe-floating-next {
    right: 1.4em;
    padding: 0.8em 1.6em;
    font-size: 0.95em;
    font-weight: 600;
    background: var(--crimson);
    border: 1px solid var(--crimson);
    color: var(--btn-ink);
  }
  .coe-floating-next:hover { background: var(--crimson-hover); border-color: var(--gold); }

  .coe-back-to-top {
    left: 1.4em;
    padding: 0.7em 1.1em;
    font-size: 0.95em;
    background: var(--card);
    border: 1px solid var(--card-border);
    color: var(--ink);
  }
  .coe-back-to-top:hover { border-color: var(--gold); color: var(--gold); }
</style>
</head>
<body>
<div class="coe-toolbar">

</div>

<button id="floatingNextBtn" type="button" class="coe-floating-btn coe-floating-next"></button>
<button id="backToTopBtn" type="button" class="coe-floating-btn coe-back-to-top" title="Back to top" aria-label="Back to top">&uarr; Top</button>

<div id="app"></div>

  // -------------------------------------------------------------------------
  // Pure scoring logic - mirrors game.py's evaluate().
  // -------------------------------------------------------------------------

  function evaluate(students, guesses) {
    var results = [];
    var correct = 0;

    students.forEach(function (student) {
      var guessedAI = guesses[student.name];
      var actuallyAI = student.isAI;
      var isCorrect = guessedAI === actuallyAI;
      if (isCorrect) correct += 1;

      results.push({
        name: student.name,
        className: student.className,
        actuallyAI: actuallyAI,
        guessedAI: guessedAI,
        correct: isCorrect,
        tells: student.tells
      });
    });

    var total = students.length;
    var verdict;
    if (correct === total) {
      verdict = "Perfect read. Not even the best AI in this class could fool you.";
    } else if (correct >= Math.floor(total / 2) + 1) {
      verdict = "Solid instincts. A few tells slipped past you, though.";
    } else {
      verdict = "The class fooled you more than you fooled them. Sharpen your ear for the tells.";
    }

    return { results: results, correct: correct, total: total, verdict: verdict };
  }

  // -------------------------------------------------------------------------
  // Application state
  // -------------------------------------------------------------------------

  function freshState() {
    var conversation = {};
    var askedIds = {};
    STUDENTS.forEach(function (s) {
      conversation[s.name] = [];
      askedIds[s.name] = [];
    });
    return {
      phase: "intro",       // intro | interrogate | guessing | reveal
      studentIdx: 0,
      conversation: conversation,
      askedIds: askedIds,
      guesses: {}
    };
  }

  var state = freshState();

  function currentStudent() {
    return STUDENTS[state.studentIdx];
  }

  // -------------------------------------------------------------------------
  // Rendering helpers
  // -------------------------------------------------------------------------

  var app = document.getElementById("app");

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function headerHtml() {
    return '<h1 class="coe-title">CLASS D DECEPTION</h1>';
  }

  // -------------------------------------------------------------------------
  // Theme toggle - kept in a plain JS variable, not persisted anywhere, so
  // it resets to dark mode on every page reload.
  // -------------------------------------------------------------------------

  var currentTheme = "dark";
  var themeToggleBtn = document.getElementById("themeToggleBtn");

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", currentTheme);
    themeToggleBtn.textContent = currentTheme === "dark" ? "Dark Mode" : "Light Mode";
  }

  themeToggleBtn.onclick = function () {
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    applyTheme();
  };

  applyTheme();

  // -------------------------------------------------------------------------
  // Review panel - lets the player re-read any previously interrogated
  // student's Q&A at any point before locking in their final guesses.
  // Purely a read of state.conversation; does not touch scoring or flow.
  // -------------------------------------------------------------------------

  var reviewPanel = document.getElementById("reviewPanel");
  var reviewBackdrop = document.getElementById("reviewBackdrop");
  var reviewContent = document.getElementById("reviewContent");

  function refreshReviewPanel() {
    reviewContent.innerHTML = "";
    var any = false;

    STUDENTS.forEach(function (student) {
      var convo = state.conversation[student.name];
      if (!convo.length) return;
      any = true;

      var card = document.createElement("div");
      card.className = "coe-card";
      card.id = "review-card-" + student.name.replace(/\s+/g, "-");

      var head = document.createElement("div");
      head.style.marginBottom = "0.5em";
      head.innerHTML = "<b>" + escapeHtml(student.name) + "</b><br>" +
        '<span class="coe-class-tag">' + escapeHtml(student.className) + "</span>";
      card.appendChild(head);

      convo.forEach(function (turn) {
        var log = document.createElement("div");
        log.className = "coe-log";
        log.innerHTML =
          '<span class="coe-you">You:</span> ' + escapeHtml(turn.q) + '<br>' +
          '<span class="coe-them">' + escapeHtml(student.name) + ':</span> ' + escapeHtml(turn.a);
        card.appendChild(log);
      });

      reviewContent.appendChild(card);
    });

    if (!any) {
      var empty = document.createElement("p");
      empty.className = "coe-review-empty";
      empty.textContent = "No students interrogated yet.";
      reviewContent.appendChild(empty);
    }
  }

  function openReview() {
    refreshReviewPanel();
    reviewPanel.classList.add("open");
    reviewBackdrop.classList.add("open");
  }

  function closeReview() {
    reviewPanel.classList.remove("open");
    reviewBackdrop.classList.remove("open");
  }

  function openReviewFor(studentName) {
    openReview();
    var target = document.getElementById("review-card-" + studentName.replace(/\s+/g, "-"));
    if (target) {
      setTimeout(function () {
        target.scrollIntoView({ block: "start" });
      }, 0);
    }
  }

  document.getElementById("reviewToggleBtn").onclick = openReview;
  document.getElementById("reviewCloseBtn").onclick = closeReview;
  reviewBackdrop.onclick = closeReview;

  // -------------------------------------------------------------------------
  // Back to Top - appears once the player has scrolled down a bit.
  // -------------------------------------------------------------------------

  var backToTopBtn = document.getElementById("backToTopBtn");

  window.addEventListener("scroll", function () {
    if (window.scrollY > 300) {
      backToTopBtn.classList.add("visible");
    } else {
      backToTopBtn.classList.remove("visible");
    }
  });

  backToTopBtn.onclick = function () {
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  // -------------------------------------------------------------------------
  // Floating "Next" button - mirrors the in-flow Next Student / Proceed
  // button so the player doesn't have to scroll down after their 3rd
  // question. Only ever visible once a student's questions are exhausted.
  // -------------------------------------------------------------------------

  var floatingNextBtn = document.getElementById("floatingNextBtn");

  function updateFloatingNext() {
    if (state.phase !== "interrogate") {
      floatingNextBtn.classList.remove("visible");
      return;
    }

    var student = currentStudent();
    var asked = state.askedIds[student.name];
    var remaining = QUESTIONS_PER_STUDENT - asked.length;

    if (remaining > 0) {
      floatingNextBtn.classList.remove("visible");
      return;
    }

    var idx = state.studentIdx + 1;
    var total = STUDENTS.length;
    floatingNextBtn.textContent = idx < total ? "Next Student" : "Proceed to Final Verdict";
    floatingNextBtn.onclick = function () {
      if (idx < total) {
        state.studentIdx += 1;
      } else {
        state.phase = "guessing";
      }
      render();
    };
    floatingNextBtn.classList.add("visible");
  }

  function render() {
    app.innerHTML = "";
    var frag = document.createElement("div");
    frag.innerHTML = headerHtml();
    app.appendChild(frag);

    if (state.phase === "intro") renderIntro();
    else if (state.phase === "interrogate") renderInterrogate();
    else if (state.phase === "guessing") renderGuessing();
    else if (state.phase === "reveal") renderReveal();

    updateFloatingNext();
  }

  function renderIntro() {
    var card = document.createElement("div");
    card.className = "coe-card";
    card.innerHTML =
      "You've been assigned to figure out which of your classmates are genuine, " +
      "and which are AI plants running on borrowed personalities.<br><br>" +
      "Ask each student <b>3 questions</b>. Watch for anything that sounds off - " +
      "canned disclaimers, weirdly perfect structure, or an AI slipping out of " +
      "character entirely.";
    app.appendChild(card);

    var btn = document.createElement("button");
    btn.className = "coe-btn coe-btn-primary";
    btn.textContent = "Begin Interrogation";
    btn.onclick = function () {
      state.phase = "interrogate";
      render();
    };
    var wrap = document.createElement("div");
    wrap.className = "coe-actions";
    wrap.appendChild(btn);
    app.appendChild(wrap);
  }

  function renderInterrogate() {
    var student = currentStudent();
    var total = STUDENTS.length;
    var idx = state.studentIdx + 1;

    var progress = document.createElement("div");
    progress.className = "coe-progress";
    progress.textContent = "Student " + idx + " / " + total;
    app.appendChild(progress);

    var h2 = document.createElement("h2");
    h2.textContent = student.name;
    app.appendChild(h2);

    var card = document.createElement("div");
    card.className = "coe-card";
    card.innerHTML =
      '<span class="coe-class-tag">' + escapeHtml(student.className) + '</span><br>' +
      escapeHtml(student.background);
    app.appendChild(card);

    if (state.studentIdx > 0) {
      var prevWrap = document.createElement("div");
      for (var i = 0; i < state.studentIdx; i++) {
        var prevStudent = STUDENTS[i];
        var prevChip = document.createElement("button");
        prevChip.type = "button";
        prevChip.className = "coe-chip-btn";
        prevChip.textContent = "Review: " + prevStudent.name;
        (function (name) {
          prevChip.onclick = function () { openReviewFor(name); };
        })(prevStudent.name);
        prevWrap.appendChild(prevChip);
      }
      app.appendChild(prevWrap);
    }

    var convo = state.conversation[student.name];
    convo.forEach(function (turn) {
      var log = document.createElement("div");
      log.className = "coe-log";
      log.innerHTML =
        '<span class="coe-you">You:</span> ' + escapeHtml(turn.q) + '<br>' +
        '<span class="coe-them">' + escapeHtml(student.name) + ':</span> ' + escapeHtml(turn.a);
      app.appendChild(log);
    });

    var asked = state.askedIds[student.name];
    var remaining = QUESTIONS_PER_STUDENT - asked.length;

    if (remaining > 0) {
      var prompt = document.createElement("p");
      prompt.innerHTML = "<b>Choose a question (" + remaining + " left to ask " +
        escapeHtml(student.name) + "):</b>";
      app.appendChild(prompt);

      QUESTION_BANK.forEach(function (pair) {
        var qid = pair[0], qtext = pair[1];
        if (asked.indexOf(qid) !== -1) return;
        var btn = document.createElement("button");
        btn.className = "coe-btn";
        btn.textContent = qtext;
        btn.onclick = function () {
          var answer = randomChoice(student.responses[qid]);
          state.askedIds[student.name].push(qid);
          state.conversation[student.name].push({ q: qtext, a: answer });
          render();
        };
        app.appendChild(btn);
      });
    } else {
      var done = document.createElement("div");
      done.className = "coe-card";
      done.style.borderLeftColor = "var(--green)";
      done.textContent = "You've asked " + student.name + " enough questions.";
      app.appendChild(done);

      var nextBtn = document.createElement("button");
      nextBtn.className = "coe-btn coe-btn-primary";
      nextBtn.textContent = idx < total ? "Next Student" : "Proceed to Final Verdict";
      nextBtn.onclick = function () {
        if (idx < total) {
          state.studentIdx += 1;
        } else {
          state.phase = "guessing";
        }
        render();
      };
      var wrap = document.createElement("div");
      wrap.className = "coe-actions";
      wrap.appendChild(nextBtn);
      app.appendChild(wrap);
    }
  }

  function renderGuessing() {
    var h2 = document.createElement("h2");
    h2.textContent = "Final Verdict";
    app.appendChild(h2);

    var card = document.createElement("div");
    card.className = "coe-card";
    card.textContent = "You've spoken to all the students. Now decide: who's really an AI?";
    app.appendChild(card);

    var form = document.createElement("form");
    var draftGuesses = {};

    STUDENTS.forEach(function (student) {
      var block = document.createElement("div");
      block.className = "coe-card";

      var label = document.createElement("p");
      label.innerHTML = "Is <b>" + escapeHtml(student.name) + "</b> (" +
        escapeHtml(student.className) + ") AI-powered?";
      block.appendChild(label);

      var reviewChip = document.createElement("button");
      reviewChip.type = "button";
      reviewChip.className = "coe-chip-btn";
      reviewChip.textContent = "Review Answers";
      reviewChip.onclick = function () {
        openReviewFor(student.name);
      };
      block.appendChild(reviewChip);

      var group = document.createElement("div");
      group.className = "coe-radio-group";

      ["Not AI", "AI-powered"].forEach(function (optionLabel) {
        var id = "guess-" + student.name.replace(/\s+/g, "-") + "-" + optionLabel.replace(/\s+/g, "-");
        var wrap = document.createElement("label");

        var radio = document.createElement("input");
        radio.type = "radio";
        radio.name = "guess-" + student.name;
        radio.id = id;
        radio.value = optionLabel;
        radio.onchange = function () {
          draftGuesses[student.name] = (optionLabel === "AI-powered");
        };

        wrap.appendChild(radio);
        wrap.appendChild(document.createTextNode(optionLabel));
        group.appendChild(wrap);
      });

      block.appendChild(group);
      form.appendChild(block);
    });

    var warning = document.createElement("p");
    warning.style.color = "var(--red)";
    warning.style.display = "none";
    warning.textContent = "Give a verdict for every student before submitting.";
    form.appendChild(warning);

    var submitWrap = document.createElement("div");
    submitWrap.className = "coe-actions";
    var submitBtn = document.createElement("button");
    submitBtn.type = "submit";
    submitBtn.className = "coe-btn coe-btn-primary";
    submitBtn.textContent = "Submit Verdict";
    submitWrap.appendChild(submitBtn);
    form.appendChild(submitWrap);

    form.onsubmit = function (e) {
      e.preventDefault();
      var complete = STUDENTS.every(function (s) {
        return draftGuesses.hasOwnProperty(s.name);
      });
      if (!complete) {
        warning.style.display = "block";
        return;
      }
      state.guesses = draftGuesses;
      state.phase = "reveal";
      render();
    };

    app.appendChild(form);
  }

  function renderReveal() {
    var summary = evaluate(STUDENTS, state.guesses);

    var summaryBlock = document.createElement("div");
    summaryBlock.className = "coe-summary";
    summaryBlock.innerHTML =
      '<div class="score">' + summary.correct + ' / ' + summary.total + '</div>' +
      '<div class="verdict-line">' + escapeHtml(summary.verdict) + '</div>';
    app.appendChild(summaryBlock);

    summary.results.forEach(function (result) {
      var card = document.createElement("div");
      card.className = "coe-card";

      var verdictClass = result.correct ? "coe-verdict-correct" : "coe-verdict-wrong";
      var verdictText = result.correct ? "CORRECT" : "WRONG";
      var actually = result.actuallyAI ? "AI-powered" : "Rule-based (human-like) bot";
      var guessed = result.guessedAI ? "AI-powered" : "Not AI";

      var tellsHtml;
      if (result.actuallyAI) {
        var items = result.tells.map(function (t) {
          return '<li class="coe-tell">' + escapeHtml(t) + '</li>';
        }).join("");
        tellsHtml = "<b>Tells you could have caught:</b><ul class=\"coe-tell-list\">" + items + "</ul>";
      } else {
        tellsHtml = "<i>No red flags - consistent personality, grounded verifiable details.</i>";
      }

      card.innerHTML =
        '<div class="coe-verdict-name"><h4 style="margin:0">' + escapeHtml(result.name) +
        '</h4><span class="coe-class-tag">' + escapeHtml(result.className) + '</span></div>' +
        'Actually: ' + actually + '<br>' +
        'Your guess: ' + guessed + ' &rarr; <span class="' + verdictClass + '">' + verdictText + '</span>' +
        '<br><br>' + tellsHtml;

      app.appendChild(card);
    });

    var again = document.createElement("button");
    again.className = "coe-btn coe-btn-primary";
    again.textContent = "Play Again";
    again.onclick = function () {
      state = freshState();
      render();
    };
    var wrap = document.createElement("div");
    wrap.className = "coe-actions";
    wrap.appendChild(again);
    app.appendChild(wrap);
  }

  render();
})();
</script>
