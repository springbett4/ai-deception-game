<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class D Deception - Visual Novel Edition</title>
<style>
  /* Colors tuned so every foreground/background text pairing clears WCAG AA
     (>=4.5:1) with a margin, in both themes. Same palette as index.html. */
  :root, html[data-theme="dark"] {
    --bg-top: #201f26;
    --bg-bottom: #29272f;
    --ink: #d9d4cd;
    --muted: #9f9991;
    --crimson: #8c4a52;
    --crimson-hover: #9c5b62;
    --gold: #b9a26a;
    --tag-ink: #241f12;
    --btn-ink: #fdf7f0;
    --card: #26252d;
    --card-border: #423f48;
    --log-bg: #1c1b21;
    --log-border: #34313a;
    --green: #7ea788;
    --red: #c08d95;
    --tell: #b99498;
    --overlay: rgba(0, 0, 0, 0.45);
    --btn-hover-bg: #332f39;
    --paper: #2c2a33;
    --paper-line: rgba(255, 255, 255, 0.03);
  }

  html[data-theme="light"] {
    --bg-top: #f3ede4;
    --bg-bottom: #ece2d4;
    --ink: #3b3530;
    --muted: #625b52;
    --crimson: #9c5b62;
    --crimson-hover: #86494f;
    --gold: #6c5934;
    --tag-ink: #fbf3e4;
    --card: #fbf7f1;
    --card-border: #ddd2c2;
    --log-bg: #f5efe6;
    --log-border: #e2d7c7;
    --green: #44634c;
    --red: #8d464e;
    --tell: #785256;
    --overlay: rgba(60, 50, 40, 0.25);
    --btn-hover-bg: #efe4d2;
    --paper: #f7f0e4;
    --paper-line: rgba(0, 0, 0, 0.035);
  }

  html { transition: background-color 0.2s ease; }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
    color: var(--ink);
    font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }

  #app {
    max-width: 760px;
    margin: 0 auto;
    padding: 3.6em 1.2em 4em;
  }

  h1, h2, h3, h4 {
    font-family: Georgia, 'Times New Roman', serif;
    letter-spacing: 0.03em;
  }

  .coe-title {
    text-align: center;
    color: var(--gold);
    letter-spacing: 0.15em;
    border-bottom: 2px solid var(--crimson);
    padding-bottom: 0.4em;
    margin-bottom: 0.8em;
  }

  .coe-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 4px solid var(--crimson);
    border-radius: 6px;
    padding: 1.1em 1.4em;
    margin-bottom: 1em;
  }

  .coe-class-tag {
    display: inline-block;
    color: var(--tag-ink);
    background: var(--gold);
    font-size: 0.75em;
    font-weight: 700;
    letter-spacing: 0.08em;
    padding: 0.15em 0.6em;
    border-radius: 3px;
  }

  .coe-verdict-correct { color: var(--green); font-weight: 700; }
  .coe-verdict-wrong { color: var(--red); font-weight: 700; }
  .coe-tell { color: var(--tell); }

  .coe-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--crimson);
    border-radius: 4px;
    padding: 0.6em 1em;
    margin-bottom: 0.55em;
    font-size: 0.95em;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .coe-btn:hover {
    background: var(--btn-hover-bg);
    border-color: var(--gold);
    color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold);
  }

  .coe-btn-primary {
    background: var(--crimson);
    border-color: var(--crimson);
    color: var(--btn-ink);
    font-weight: 600;
    width: auto;
    display: inline-block;
    padding: 0.6em 1.6em;
  }
  .coe-btn-primary:hover { background: var(--crimson-hover); border-color: var(--gold); color: var(--btn-ink); }

  .coe-progress {
    text-align: center;
    color: var(--muted);
    font-size: 0.85em;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 0.6em;
  }

  .coe-actions {
    text-align: center;
    margin-top: 1.6em;
  }

  .coe-summary {
    text-align: center;
    margin-bottom: 1.4em;
  }
  .coe-summary .score {
    font-size: 2.2em;
    color: var(--gold);
    font-family: Georgia, serif;
  }
  .coe-summary .verdict-line {
    font-style: italic;
    color: var(--muted);
  }

  ul.coe-tell-list {
    margin: 0.4em 0 0;
    padding-left: 1.3em;
  }

  /* -------------------------------------------------------------------- */
  /* Toolbar (theme toggle)                                               */
  /* -------------------------------------------------------------------- */

  .coe-toolbar {
    position: fixed;
    top: 0.8em;
    left: 0;
    right: 0;
    display: flex;
    justify-content: flex-end;
    padding: 0 1em;
    z-index: 50;
  }

  .coe-icon-btn {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    padding: 0.4em 1em;
    font-size: 0.85em;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
  }
  .coe-icon-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* -------------------------------------------------------------------- */
  /* Visual novel dialogue phase                                          */
  /* -------------------------------------------------------------------- */

  .vn-scene {
    background: linear-gradient(180deg, var(--card) 0%, var(--log-bg) 100%);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 1.6em 1.4em 1.4em;
    margin-bottom: 1.2em;
  }

  .vn-stage {
    display: flex;
    align-items: center;
    gap: 1.2em;
    margin-bottom: 1.2em;
  }

  .vn-portrait {
    flex: 0 0 auto;
    width: 108px;
    height: 108px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-size: 2.2em;
    font-weight: 700;
    color: var(--btn-ink);
    border: 3px solid var(--gold);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
  }

  .vn-nameplate .vn-name {
    font-family: Georgia, serif;
    font-size: 1.35em;
    color: var(--gold);
    margin-bottom: 0.3em;
  }

  .vn-dialogue-box {
    position: relative;
    background: var(--log-bg);
    border: 1px solid var(--log-border);
    border-radius: 8px;
    padding: 1.1em 1.3em;
    margin-top: 0.6em;
  }

  .vn-dialogue-tag {
    color: var(--muted);
    font-size: 0.8em;
    letter-spacing: 0.04em;
    margin-bottom: 0.5em;
  }

  .vn-dialogue-text {
    font-size: 1.02em;
  }
  .vn-dialogue-text.intro { font-style: italic; color: var(--muted); }

  .vn-choices { margin-top: 1em; }

  .vn-choice-btn {
    display: block;
    width: 100%;
    text-align: left;
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--crimson);
    border-left: 4px solid var(--crimson);
    border-radius: 4px;
    padding: 0.65em 1em;
    margin-bottom: 0.5em;
    font-size: 0.95em;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s, background 0.15s, box-shadow 0.15s, padding-left 0.15s;
  }
  .vn-choice-btn::before { content: "\25b8  "; color: var(--gold); }
  .vn-choice-btn:hover {
    background: var(--btn-hover-bg);
    border-color: var(--gold);
    border-left-color: var(--gold);
    color: var(--gold);
    box-shadow: 0 0 0 1px var(--gold);
    padding-left: 1.2em;
  }

  .vn-advance-wrap { text-align: right; margin-top: 1em; }
  .vn-advance-btn {
    background: var(--crimson);
    color: var(--btn-ink);
    border: 1px solid var(--crimson);
    border-radius: 999px;
    padding: 0.6em 1.4em;
    font-weight: 600;
    cursor: pointer;
  }
  .vn-advance-btn:hover { background: var(--crimson-hover); border-color: var(--gold); }
  .vn-advance-btn::after { content: "  \25b8"; }

  /* -------------------------------------------------------------------- */
  /* Scrapbook / journal guessing phase                                   */
  /* -------------------------------------------------------------------- */

  .jr-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.5em;
    margin-bottom: 1.1em;
  }

  .jr-tab {
    flex: 1 1 auto;
    min-width: 2.6em;
    background: var(--card);
    color: var(--muted);
    border: 1px solid var(--card-border);
    border-radius: 4px 4px 0 0;
    padding: 0.5em 0.4em;
    font-size: 0.8em;
    text-align: center;
    cursor: pointer;
    position: relative;
  }
  .jr-tab:hover { color: var(--gold); border-color: var(--gold); }
  .jr-tab.active {
    background: var(--paper);
    color: var(--gold);
    border-color: var(--gold);
    border-bottom-color: var(--paper);
    font-weight: 700;
  }
  .jr-tab .jr-tab-dot {
    display: inline-block;
    width: 0.55em;
    height: 0.55em;
    border-radius: 50%;
    border: 1px solid var(--muted);
    margin-right: 0.35em;
    vertical-align: middle;
  }
  .jr-tab.marked .jr-tab-dot { background: var(--gold); border-color: var(--gold); }

  .jr-page {
    background: var(--paper);
    background-image: repeating-linear-gradient(var(--paper) 0 27px, var(--paper-line) 27px 28px);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.25);
    padding: 1.4em 1.5em;
    margin-bottom: 1em;
  }

  .jr-page-header {
    display: flex;
    align-items: center;
    gap: 0.9em;
    margin-bottom: 1em;
    padding-bottom: 0.9em;
    border-bottom: 1px dashed var(--card-border);
  }

  .jr-portrait-sm {
    flex: 0 0 auto;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Georgia, serif;
    font-weight: 700;
    color: var(--btn-ink);
    border: 2px solid var(--gold);
  }

  .jr-page-header .jr-name {
    font-family: Georgia, serif;
    font-size: 1.15em;
    color: var(--gold);
    margin-bottom: 0.2em;
  }

  .jr-transcript-item { margin-bottom: 0.8em; }
  .jr-transcript-q { color: var(--muted); font-size: 0.9em; margin-bottom: 0.15em; }
  .jr-transcript-a { color: var(--ink); }

  .jr-transcript-empty { color: var(--muted); font-style: italic; }

  .jr-slip {
    margin-top: 1.2em;
    padding-top: 1.1em;
    border-top: 2px dashed var(--card-border);
    position: relative;
  }
  .jr-slip-label {
    color: var(--muted);
    font-size: 0.85em;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 0.6em;
  }
  .jr-slip-options {
    display: flex;
    gap: 0.8em;
  }
  .jr-slip-btn {
    flex: 1 1 0;
    background: var(--card);
    color: var(--ink);
    border: 2px solid var(--card-border);
    border-radius: 4px;
    padding: 0.7em 0.6em;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-align: center;
    transition: transform 0.1s ease, border-color 0.15s, background 0.15s;
  }
  .jr-slip-btn:hover { border-color: var(--gold); }
  .jr-slip-btn.selected-human {
    background: var(--green);
    border-color: var(--green);
    color: var(--btn-ink);
    transform: rotate(-2deg);
  }
  .jr-slip-btn.selected-ai {
    background: var(--crimson);
    border-color: var(--crimson);
    color: var(--btn-ink);
    transform: rotate(2deg);
  }

  .jr-pagenav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.2em;
  }
  .jr-pagenav-btn {
    background: var(--card);
    color: var(--ink);
    border: 1px solid var(--card-border);
    border-radius: 4px;
    padding: 0.5em 1em;
    cursor: pointer;
  }
  .jr-pagenav-btn:hover { border-color: var(--gold); color: var(--gold); }
  .jr-pagenav-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .jr-pagenav-count { color: var(--muted); font-size: 0.85em; }

  .jr-submit-note { text-align: center; color: var(--muted); margin-top: 0.6em; font-size: 0.9em; }

  /* -------------------------------------------------------------------- */
  /* Landing page silhouettes                                             */
  /* -------------------------------------------------------------------- */

  .intro-silhouettes {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 1.4em;
    margin: 0 0 1.4em;
    flex-wrap: wrap;
  }
  .silhouette-figure {
    width: 84px;
    flex: 0 0 auto;
  }
  .silhouette-figure svg { width: 100%; height: auto; display: block; }
</style>
</head>
<body>

  <button id="themeToggleBtn" class="coe-icon-btn" title="Toggle light / dark mode">Dark Mode</button>
</div>

<div id="app"></div>

  var PORTRAIT_COLORS = ["#62373e", "#456237", "#374c62", "#625037", "#543762", "#37625e"];

  function initials(name) {
    return name.split(/\s+/).map(function (w) { return w[0]; }).join("").toUpperCase();
  }

  function portraitStyle(index) {
    var color = PORTRAIT_COLORS[index % PORTRAIT_COLORS.length];
    return "background: radial-gradient(circle at 35% 30%, " + color + ", " +
      color + " 60%, #000 160%);";
  }

  // -------------------------------------------------------------------------
  // Pure scoring logic - mirrors game.py's evaluate(). Identical to index.html.
  // -------------------------------------------------------------------------

  function evaluate(students, guesses) {
    var results = [];
    var correct = 0;

    students.forEach(function (student) {
      var guessedAI = guesses[student.name];
      var actuallyAI = student.isAI;
      var isCorrect = guessedAI === actuallyAI;
      if (isCorrect) correct += 1;

      results.push({
        name: student.name,
        className: student.className,
        actuallyAI: actuallyAI,
        guessedAI: guessedAI,
        correct: isCorrect,
        tells: student.tells
      });
    });

    var total = students.length;
    var verdict;
    if (correct === total) {
      verdict = "Perfect read. Not even the best AI in this class could fool you.";
    } else if (correct >= Math.floor(total / 2) + 1) {
      verdict = "Solid instincts. A few tells slipped past you, though.";
    } else {
      verdict = "The class fooled you more than you fooled them. Sharpen your ear for the tells.";
    }

    return { results: results, correct: correct, total: total, verdict: verdict };
  }

  // -------------------------------------------------------------------------
  // Application state
  // -------------------------------------------------------------------------

  function freshState() {
    var conversation = {};
    var askedIds = {};
    STUDENTS.forEach(function (s) {
      conversation[s.name] = [];
      askedIds[s.name] = [];
    });
    return {
      phase: "intro",       // intro | interrogate | guessing | reveal
      studentIdx: 0,
      conversation: conversation,
      askedIds: askedIds,
      guesses: {},
      journalIdx: 0
    };
  }

  var state = freshState();

  function currentStudent() {
    return STUDENTS[state.studentIdx];
  }

  var app = document.getElementById("app");

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function headerHtml() {
    return '<h1 class="coe-title">CLASS D DECEPTION</h1>';
  }

  // -------------------------------------------------------------------------
  // Theme toggle - plain JS variable, not persisted, resets to dark on reload.
  // -------------------------------------------------------------------------

  var currentTheme = "dark";
  var themeToggleBtn = document.getElementById("themeToggleBtn");

  function applyTheme() {
    document.documentElement.setAttribute("data-theme", currentTheme);
    themeToggleBtn.textContent = currentTheme === "dark" ? "Dark Mode" : "Light Mode";
  }

  themeToggleBtn.onclick = function () {
    currentTheme = currentTheme === "dark" ? "light" : "dark";
    applyTheme();
  };

  applyTheme();

  // -------------------------------------------------------------------------

  function render() {
    app.innerHTML = "";
    var frag = document.createElement("div");
    frag.innerHTML = headerHtml();
    app.appendChild(frag);

    if (state.phase === "intro") renderIntro();
    else if (state.phase === "interrogate") renderInterrogate();
    else if (state.phase === "guessing") renderGuessing();
    else if (state.phase === "reveal") renderReveal();
  }

    slipOptions.className = "jr-slip-options";

    var currentGuess = state.guesses[student.name];

    var humanBtn = document.createElement("button");
    humanBtn.type = "button";
    humanBtn.className = "jr-slip-btn" + (currentGuess === false ? " selected-human" : "");
    humanBtn.textContent = "HUMAN";
    humanBtn.onclick = function () {
      state.guesses[student.name] = false;
      render();
    };
    slipOptions.appendChild(humanBtn);

    var aiBtn = document.createElement("button");
    aiBtn.type = "button";
    aiBtn.className = "jr-slip-btn" + (currentGuess === true ? " selected-ai" : "");
    aiBtn.textContent = "AI-POWERED";
    aiBtn.onclick = function () {
      state.guesses[student.name] = true;
      render();
    };
    slipOptions.appendChild(aiBtn);

    slip.appendChild(slipOptions);
    page.appendChild(slip);

    app.appendChild(page);

    var markedCount = STUDENTS.filter(function (s) {
      return state.guesses.hasOwnProperty(s.name);
    }).length;

    var submitWrap = document.createElement("div");
    submitWrap.className = "coe-actions";
    var submitBtn = document.createElement("button");
    submitBtn.type = "button";
    submitBtn.className = "coe-btn coe-btn-primary";
    submitBtn.textContent = "Submit Final Verdict";
    submitBtn.onclick = function () {
      if (markedCount < total) return;
      state.phase = "reveal";
      render();
    };
    submitWrap.appendChild(submitBtn);
    app.appendChild(submitWrap);

    if (markedCount < total) {
      var note = document.createElement("div");
      note.className = "jr-submit-note";
      note.textContent = markedCount + " of " + total + " pages marked - mark every page before submitting.";
      app.appendChild(note);
    }
  }

  function renderReveal() {
    var summary = evaluate(STUDENTS, state.guesses);

    var summaryBlock = document.createElement("div");
    summaryBlock.className = "coe-summary";
    summaryBlock.innerHTML =
      '<h2 style="margin-bottom:0.2em">Case File: Closed</h2>' +
      '<div class="score">' + summary.correct + ' / ' + summary.total + '</div>' +
      '<div class="verdict-line">' + escapeHtml(summary.verdict) + '</div>';
    app.appendChild(summaryBlock);

    summary.results.forEach(function (result) {
      var card = document.createElement("div");
      card.className = "coe-card";

      var verdictClass = result.correct ? "coe-verdict-correct" : "coe-verdict-wrong";
      var verdictText = result.correct ? "CORRECT" : "WRONG";
      var actually = result.actuallyAI ? "AI-powered" : "Rule-based (human-like) bot";
      var guessed = result.guessedAI ? "AI-powered" : "Not AI";

      var tellsHtml;
      if (result.actuallyAI) {
        var items = result.tells.map(function (t) {
          return '<li class="coe-tell">' + escapeHtml(t) + '</li>';
        }).join("");
        tellsHtml = "<b>Tells you could have caught:</b><ul class=\"coe-tell-list\">" + items + "</ul>";
      } else {
        tellsHtml = "<i>No red flags - consistent personality, grounded verifiable details.</i>";
      }

      card.innerHTML =
        '<h4 style="margin:0 0 0.4em">' + escapeHtml(result.name) +
        ' <span class="coe-class-tag">' + escapeHtml(result.className) + '</span></h4>' +
        'Actually: ' + actually + '<br>' +
        'Your guess: ' + guessed + ' &rarr; <span class="' + verdictClass + '">' + verdictText + '</span>' +
        '<br><br>' + tellsHtml;

      app.appendChild(card);
    });

    var again = document.createElement("button");
    again.className = "coe-btn coe-btn-primary";
    again.textContent = "Play Again";
    again.onclick = function () {
      state = freshState();
      render();
    };
    var wrap = document.createElement("div");
    wrap.className = "coe-actions";
    wrap.appendChild(again);
    app.appendChild(wrap);
  }

  render();
})();
</script>
</body>
</html>
