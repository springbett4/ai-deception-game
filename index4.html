<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Class D Deception - Reader Edition</title>
<style>
  /* ---------------------------------------------------------------------
     Manga/media-reader inspired palette: dark slate base, cyan + magenta
     accents. Deliberately NOT the crimson/gold Classroom-of-the-Elite
     theme (index/index2) and NOT the flat quiz palette (index3).
     Colors tuned so text/background pairings clear WCAG AA in both modes.
  --------------------------------------------------------------------- */
  :root, html[data-theme="dark"] {
    --bg: #0a0d14;
    --bg-soft: #0e1220;
    --surface: #141a29;
    --surface-2: #1a2133;
    --surface-hover: #202940;
    --border: #263049;
    --border-soft: #1d2538;
    --text: #e7ecf7;
    --text-heading: #ffffff;
    --text-muted: #90a0c0;
    --text-faint: #5f6d8c;
    --cyan: #34e0e0;
    --cyan-soft: rgba(52, 224, 224, 0.14);
    --magenta: #ff5fa8;
    --magenta-soft: rgba(255, 95, 168, 0.14);
    --amber: #ffb454;
    --violet: #a78bfa;
    --green: #4ade80;
    --red: #ff6b6b;
    --accent-grad: linear-gradient(135deg, var(--cyan), var(--magenta));
    --shadow-lift: 0 18px 40px rgba(0, 0, 0, 0.45);
    --shadow-card: 0 6px 18px rgba(0, 0, 0, 0.35);
    --scrim: rgba(6, 8, 14, 0.72);
  }

  html[data-theme="light"] {
    --bg: #f4f6fb;
    --bg-soft: #eaeef7;
    --surface: #ffffff;
    --surface-2: #f2f4fa;
    --surface-hover: #e8ecf7;
    --border: #dbe1ee;
    --border-soft: #e6eaf3;
    --text: #232a3d;
    --text-heading: #10131f;
    --text-muted: #5b6a8a;
    --text-faint: #8891a8;
    --cyan: #0891a1;
    --cyan-soft: rgba(8, 145, 161, 0.10);
    --magenta: #c81b71;
    --magenta-soft: rgba(200, 27, 113, 0.10);
    --amber: #b5720b;
    --violet: #7c3aed;
    --green: #158a4d;
    --red: #d13c3c;
    --accent-grad: linear-gradient(135deg, var(--cyan), var(--magenta));
    --shadow-lift: 0 18px 40px rgba(30, 40, 70, 0.18);
    --shadow-card: 0 6px 16px rgba(30, 40, 70, 0.10);
    --scrim: rgba(240, 243, 250, 0.75);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
    transition: background-color 0.25s ease, color 0.25s ease;
    min-height: 100vh;
  }

  a { color: inherit; }
  button { font-family: inherit; }

  /* ---------------------------- Top nav ---------------------------- */
  .topnav {
    position: sticky;
    top: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 12px 24px;
    background: rgba(10, 13, 20, 0.78);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border-soft);
  }
  html[data-theme="light"] .topnav { background: rgba(244, 246, 251, 0.82); }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 800;
    font-size: 17px;
    letter-spacing: 0.2px;
    color: var(--text-heading);
    white-space: nowrap;
    flex: 0 0 auto;
  }
  .brand-mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: var(--accent-grad);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 900;
    color: #0a0d14;
    flex: 0 0 auto;
  }

  .nav-search {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    max-width: 420px;
    margin: 0 auto 0 18px;
    padding: 8px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-faint);
  }
  .nav-search svg { width: 16px; height: 16px; flex: 0 0 auto; color: var(--text-faint); }
  .nav-search input {
    border: none;
    outline: none;
    background: transparent;
    color: var(--text);
    font-size: 13.5px;
    width: 100%;
  }
  .nav-search input::placeholder { color: var(--text-faint); }
  .nav-search:focus-within { border-color: var(--cyan); }

  .nav-icons { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; position: relative; }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: border-color 0.2s ease, color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  }
  .icon-btn:hover { border-color: var(--cyan); color: var(--cyan); transform: translateY(-2px); }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn.profile {
    background: var(--accent-grad);
    color: #0a0d14;
    font-weight: 800;
    font-size: 12px;
    border: none;
  }
  .icon-btn.profile:hover { color: #0a0d14; transform: translateY(-2px) scale(1.05); }

  /* ------------------------- Stats popover ------------------------- */
  .stats-panel {
    position: absolute;
    top: 100%;
    right: 0;
    margin-top: 10px;
    width: 240px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    box-shadow: var(--shadow-lift);
    z-index: 60;
    animation: pop-in 0.18s ease;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(-6px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .stats-panel-title { font-size: 13px; font-weight: 800; color: var(--text-heading); margin-bottom: 10px; }
  .stat-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    font-size: 13px;
    color: var(--text-muted);
    padding: 7px 0;
    border-bottom: 1px solid var(--border-soft);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row strong { color: var(--text-heading); }

  /* ------------------------- Phase transitions ------------------------- */
  #appInner {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.32s ease, transform 0.32s ease;
  }
  #appInner.transitioning { opacity: 0; transform: translateY(16px); }

  /* ------------------------------- Hero ------------------------------- */
  .hero {
    position: relative;
    overflow: hidden;
    padding: 56px 24px 64px;
    background: radial-gradient(ellipse at 20% 0%, rgba(52,224,224,0.10), transparent 55%),
                radial-gradient(ellipse at 85% 25%, rgba(255,95,168,0.10), transparent 50%),
                var(--bg-soft);
  }
  .hero-bg-blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(70px);
    opacity: 0.35;
    pointer-events: none;
    z-index: 0;
  }
  .blob-a { width: 420px; height: 420px; background: var(--cyan); top: -160px; left: -100px; animation: drift-a 22s ease-in-out infinite; }
  .blob-b { width: 380px; height: 380px; background: var(--magenta); top: 40px; right: -140px; animation: drift-b 26s ease-in-out infinite; }
  .blob-c { width: 300px; height: 300px; background: var(--violet); bottom: -180px; left: 35%; animation: drift-c 30s ease-in-out infinite; }
  html[data-theme="light"] .hero-bg-blob { opacity: 0.18; }

  @keyframes drift-a {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(60px, 50px) scale(1.15); }
  }
  @keyframes drift-b {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(-70px, 40px) scale(1.1); }
  }
  @keyframes drift-c {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(40px, -50px) scale(1.2); }
  }

  .particle {
    position: absolute;
    border-radius: 50%;
    background: var(--cyan);
    opacity: 0.5;
    pointer-events: none;
    z-index: 0;
    animation: particle-float linear infinite;
  }
  @keyframes particle-float {
    0% { transform: translateY(0) translateX(0); opacity: 0; }
    10% { opacity: 0.55; }
    90% { opacity: 0.4; }
    100% { transform: translateY(-140px) translateX(20px); opacity: 0; }
  }

  .hero-inner {
    position: relative;
    z-index: 1;
    max-width: 1160px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 300px;
    gap: 44px;
    align-items: center;
  }
  @media (max-width: 860px) {
    .hero-inner { grid-template-columns: 1fr; }
    .hero-cover { order: -1; margin: 0 auto; }
  }

  .hero-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
  .tag-pill {
    font-size: 12px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 999px;
    letter-spacing: 0.3px;
    border: 1px solid transparent;
  }
  .tag-mystery { background: rgba(167,139,250,0.15); color: var(--violet); border-color: rgba(167,139,250,0.35); }
  .tag-psych { background: var(--magenta-soft); color: var(--magenta); border-color: rgba(255,95,168,0.35); }
  .tag-ai { background: var(--cyan-soft); color: var(--cyan); border-color: rgba(52,224,224,0.35); }
  .tag-school { background: rgba(255,180,84,0.15); color: var(--amber); border-color: rgba(255,180,84,0.35); }

  .hero-title {
    font-size: clamp(32px, 5vw, 52px);
    font-weight: 900;
    letter-spacing: -0.5px;
    margin: 0 0 14px;
    color: var(--text-heading);
    line-height: 1.05;
  }
  .hero-title .accent { background: var(--accent-grad); -webkit-background-clip: text; background-clip: text; color: transparent; }

  .hero-desc {
    font-size: 15px;
    color: var(--text-muted);
    max-width: 560px;
    margin: 0 0 20px;
  }

  .hero-meta {
    display: flex;
    align-items: center;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 28px;
    font-size: 13.5px;
    color: var(--text-muted);
  }
  .rating-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    font-weight: 700;
    color: var(--amber);
  }
  .rating-badge svg { width: 15px; height: 15px; fill: var(--amber); }
  .meta-sep { color: var(--text-faint); }

  .hero-actions { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  .play-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border: none;
    border-radius: 10px;
    background: var(--accent-grad);
    color: #0a0d14;
    font-size: 15.5px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(52, 224, 224, 0.25);
    transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  }
  .play-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 14px 36px rgba(255, 95, 168, 0.3); filter: brightness(1.05); }
  .play-btn:active { transform: translateY(0) scale(0.99); }
  .play-btn svg { width: 18px; height: 18px; }

  .redo-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 13px 22px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface);
    color: var(--text);
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.2s ease, transform 0.2s ease, color 0.2s ease;
  }
  .redo-btn:hover { border-color: var(--cyan); color: var(--cyan); transform: translateY(-2px); }

  /* Cover art panel - stylized CSS/SVG, no real image */
  .hero-cover {
    width: 260px;
    aspect-ratio: 3 / 4;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 26px),
      conic-gradient(from 200deg at 30% 20%, var(--cyan), var(--violet) 35%, var(--magenta) 65%, var(--cyan) 100%);
    background-size: auto, 200% 200%;
    animation: cover-hue 14s ease infinite;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lift);
  }
  @keyframes cover-hue {
    0%, 100% { background-position: 0 0, 0% 50%; }
    50% { background-position: 0 0, 100% 50%; }
  }
  .hero-cover::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(6,8,14,0) 40%, rgba(6,8,14,0.75) 100%);
  }
  .hero-cover-glyph {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 92px;
    font-weight: 900;
    color: rgba(255,255,255,0.14);
  }
  .hero-cover-label {
    position: absolute;
    left: 14px;
    bottom: 14px;
    right: 14px;
    color: #fff;
    z-index: 1;
  }
  .hero-cover-label .case { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; opacity: 0.75; margin-bottom: 3px; }
  .hero-cover-label .title { font-size: 15px; font-weight: 800; }
  .hero-cover-corner {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1px;
    padding: 4px 8px;
    border-radius: 5px;
    background: rgba(6,8,14,0.5);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.25);
  }

  /* ---------------------------- Cast grid ---------------------------- */
  .section {
    max-width: 1160px;
    margin: 0 auto;
    padding: 40px 24px 70px;
  }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .section-title { font-size: 20px; font-weight: 800; color: var(--text-heading); margin: 0; }
  .section-sub { font-size: 13px; color: var(--text-faint); }

  /* Always an even number of cards per row: 2 / 4 / 6 depending on width -
     never an auto-fill count that can strand a lone card on its own row. */
  .cast-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 18px;
  }
  @media (min-width: 640px) {
    .cast-grid { grid-template-columns: repeat(4, 1fr); }
  }
  @media (min-width: 980px) {
    .cast-grid { grid-template-columns: repeat(6, 1fr); }
  }

  .cast-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    cursor: pointer;
    position: relative;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .cast-card:hover {
    transform: translateY(-6px) scale(1.02);
    box-shadow: var(--shadow-lift);
    border-color: var(--cyan);
  }
  .cast-portrait {
    aspect-ratio: 3 / 4;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    font-weight: 900;
    color: rgba(255,255,255,0.85);
    overflow: hidden;
  }
  .initials { position: relative; z-index: 1; text-shadow: 0 2px 10px rgba(0,0,0,0.35); }
  .portrait-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 1;
  }
  .cast-portrait::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,0.55) 100%);
  }
  .cast-badge {
    position: absolute;
    top: 8px;
    left: 8px;
    z-index: 2;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.5px;
    padding: 3px 7px;
    border-radius: 5px;
    background: rgba(6,8,14,0.55);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .cast-hover-play {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(6, 8, 14, 0.45);
    opacity: 0;
    transition: opacity 0.22s ease;
  }
  .cast-card:hover .cast-hover-play { opacity: 1; }
  .cast-hover-play span {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--accent-grad);
    color: #0a0d14;
    font-weight: 800;
    font-size: 12.5px;
    transform: translateY(6px);
    transition: transform 0.22s ease;
  }
  .cast-card:hover .cast-hover-play span { transform: translateY(0); }
  .cast-hover-play svg { width: 12px; height: 12px; }

  .cast-info { padding: 12px 12px 14px; }
  .cast-name { font-size: 14.5px; font-weight: 700; color: var(--text-heading); margin-bottom: 2px; }
  .cast-class { font-size: 11.5px; color: var(--text-faint); margin-bottom: 8px; }
  .cast-teaser {
    font-size: 12px;
    color: var(--text-muted);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* --------------------------- Game layout / sidebar --------------------------- */
  .game-layout {
    max-width: 980px;
    margin: 0 auto;
    padding: 40px 24px 70px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 230px;
    gap: 28px;
    align-items: start;
  }
  .game-main { min-width: 0; }
  @media (max-width: 760px) {
    .game-layout { grid-template-columns: 1fr; }
    .side-roster { order: -1; position: static; }
  }

  .side-roster {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
    position: sticky;
    top: 84px;
  }
  .side-roster-title {
    font-size: 12px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--text-faint);
    margin-bottom: 12px;
  }
  .side-roster-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px;
    border-radius: 10px;
    margin-bottom: 4px;
    transition: background 0.18s ease;
  }
  .side-roster-item.current { background: var(--cyan-soft); }
  .mini-portrait {
    width: 30px;
    height: 30px;
    border-radius: 8px;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 800;
    color: #fff;
  }
  .side-roster-name { font-size: 12.5px; font-weight: 700; color: var(--text-heading); line-height: 1.3; }
  .side-roster-status { font-size: 10.5px; font-weight: 700; letter-spacing: 0.2px; }
  .side-roster-status.asked { color: var(--green); }
  .side-roster-status.notasked { color: var(--text-faint); }

  /* --------------------------- Reader panel --------------------------- */
  .reader-shell {
    max-width: 720px;
    margin: 0 auto;
    padding: 40px 24px 70px;
  }
  .progress-wrap { margin-bottom: 22px; }
  .progress-label {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--text-faint);
    margin-bottom: 7px;
    font-weight: 600;
  }
  .progress-track {
    height: 6px;
    background: var(--surface-2);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent-grad);
    border-radius: 999px;
    transition: width 0.35s ease;
  }

  .speaker-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  .speaker-portrait {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 800;
    color: #fff;
    flex: 0 0 auto;
    position: relative;
    overflow: hidden;
  }
  .speaker-name { font-size: 15px; font-weight: 800; color: var(--text-heading); }
  .speaker-class { font-size: 12px; color: var(--text-faint); }

  .panel-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    box-shadow: var(--shadow-card);
  }
  .panel-title { font-size: 18px; font-weight: 800; color: var(--text-heading); margin: 0 0 18px; }

  .choice-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .choice-card {
    text-align: left;
    padding: 14px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    font-size: 14.5px;
    cursor: pointer;
    transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease, background 0.18s ease;
  }
  .choice-card:hover {
    transform: translateY(-3px) scale(1.01);
    border-color: var(--cyan);
    background: var(--surface-hover);
    box-shadow: 0 8px 20px rgba(52, 224, 224, 0.12);
  }
  .choice-card.selected {
    border-color: var(--magenta);
    background: var(--magenta-soft);
    box-shadow: 0 8px 20px rgba(255, 95, 168, 0.15);
    font-weight: 600;
  }

  // -------------------------------------------------------------------------
  // Pure scoring logic - mirrors game.py's evaluate(). Reads isAI/tells from
  // the current persona assignment (see "Persona shuffle" below), not
  // directly off STUDENTS, since restarting the game reshuffles who's AI.
  // -------------------------------------------------------------------------

  function evaluate(students, guesses, personas) {
    var results = [];
    var correct = 0;

    students.forEach(function (student) {
      var guessedAI = guesses[student.name];
      var actuallyAI = personas[student.name].isAI;
      var isCorrect = guessedAI === actuallyAI;
      if (isCorrect) correct += 1;

      results.push({
        name: student.name,
        className: student.className,
        actuallyAI: actuallyAI,
        guessedAI: guessedAI,
        correct: isCorrect,
        tells: personas[student.name].tells
      });
    });

    var total = students.length;
    var verdict;
    if (correct === total) {
      verdict = "Perfect read. Not even the best AI in this class could fool you.";
    } else if (correct >= Math.floor(total / 2) + 1) {
      verdict = "Solid instincts. A few tells slipped past you, though.";
    } else {
      verdict = "The class fooled you more than you fooled them. Sharpen your ear for the tells.";
    }

    return { results: results, correct: correct, total: total, verdict: verdict };
  }

  // -------------------------------------------------------------------------
  // Persona shuffle - on every fresh game, the isAI/responses/tells bundles
  // are redealt across the 6 fixed students (name/class/background/portrait
  // stay put; only who's "really" AI changes). A few AI responses refer to
  // their speaker by first name in third person (a tell in itself) - when a
  // bundle moves to a different student, that name is swapped so the line
  // still reads as self-reference instead of naming a stranger.
  // -------------------------------------------------------------------------

  function firstName(fullName) {
    return fullName.split(" ")[0];
  }

  function replaceName(str, from, to) {
    return str.replace(new RegExp("\\b" + from + "\\b", "g"), to);
  }

  function remapResponses(responsesObj, from, to) {
    var out = {};
    Object.keys(responsesObj).forEach(function (qid) {
      out[qid] = responsesObj[qid].map(function (a) { return replaceName(a, from, to); });
    });
    return out;
  }

  function shuffleArray(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function assignPersonas() {
    var pool = shuffleArray(STUDENTS.map(function (s) {
      return { originalName: s.name, isAI: s.isAI, responses: s.responses, tells: s.tells };
    }));
    var assignment = {};
    STUDENTS.forEach(function (shell, i) {
      var persona = pool[i];
      var origFirst = firstName(persona.originalName);
      var shellFirst = firstName(shell.name);
      var responses = persona.responses;
      var tells = persona.tells;
      if (origFirst !== shellFirst) {
        responses = remapResponses(persona.responses, origFirst, shellFirst);
        tells = persona.tells.map(function (t) { return replaceName(t, origFirst, shellFirst); });
      }
      assignment[shell.name] = { isAI: persona.isAI, responses: responses, tells: tells };
    });
    return assignment;
  }

  var STATS_KEY = "classDDeceptionStats_v1";

  function loadStats() {
    try {
      var raw = localStorage.getItem(STATS_KEY);
      var parsed = raw ? JSON.parse(raw) : {};
      return {
        gamesPlayed: parsed.gamesPlayed || 0,
        wins: parsed.wins || 0,
        perfectCount: parsed.perfectCount || 0
      };
    } catch (e) {
      return { gamesPlayed: 0, wins: 0, perfectCount: 0 };
    }
  }

  function saveStats(s) {
    try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) { /* storage unavailable */ }
  }

  var stats = loadStats();

  function recordGameResult(summary) {
    stats.gamesPlayed += 1;
    var caughtAllAI = summary.results.every(function (r) {
      return !r.actuallyAI || r.guessedAI === true;
    });
    if (caughtAllAI) stats.wins += 1;
    if (summary.correct === summary.total) stats.perfectCount += 1;
    saveStats(stats);
  }

  // -------------------------------------------------------------------------
  // Portraits - CSS gradient panels + initials by default. If a matching

  // -------------------------------------------------------------------------

  var GRADIENTS = [
    ["#34e0e0", "#3b82f6"],
    ["#ff5fa8", "#a855f7"],
    ["#ffb454", "#f97316"],
    ["#4ade80", "#10b981"],
    ["#ff6b6b", "#ef4444"],
    ["#818cf8", "#6366f1"]
  ];

  var PORTRAIT_CLASS = { big: "cast-portrait", small: "speaker-portrait", mini: "mini-portrait" };

  function initials(name) {
    return name.split(/\s+/).map(function (w) { return w[0]; }).join("").toUpperCase();
  }

  function slug(name) {
    return name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");
  }

  function gradientFor(index) {
    var pair = GRADIENTS[index % GRADIENTS.length];
    return "linear-gradient(145deg, " + pair[0] + ", " + pair[1] + ")";
  }

  function makePortraitEl(index, name, variant) {
    var el = document.createElement("div");
    el.className = PORTRAIT_CLASS[variant] || PORTRAIT_CLASS.small;
    el.style.background = gradientFor(index);

    var span = document.createElement("span");
    span.className = "initials";
    span.textContent = initials(name);
    el.appendChild(span);

    var img = document.createElement("img");
    img.className = "portrait-img";
    img.alt = "";
    img.src = "images/" + slug(name) + ".png";
    img.onerror = function () { img.remove(); };
    el.appendChild(img);

    return el;
  }

  // -------------------------------------------------------------------------
  // Screen transitions - fade + slide, used every time the phase changes.
  // -------------------------------------------------------------------------

  function go(mutate) {
    appInner.classList.add("transitioning");
    window.setTimeout(function () {
      mutate();
      render();
      void appInner.offsetWidth;
      appInner.classList.remove("transitioning");
    }, 260);
  }

  function goToStudent(idx, recordHistory) {
    go(function () {
      if (recordHistory) state.history.push(state.studentIdx);
      state.studentIdx = idx;
      state.awaitingContinue = false;
      state.pendingTurn = null;
      state.selectedQid = null;
      state.phase = "interrogate";
    });
  }

  function goBack() {
    if (state.history.length === 0) return;
    go(function () {
      var prevIdx = state.history.pop();
      state.studentIdx = prevIdx;
      state.awaitingContinue = false;
      state.pendingTurn = null;
      state.selectedQid = null;
      state.phase = "interrogate";
    });
  }

      nextBtn.type = "button";
      nextBtn.className = "btn-primary";
      var isLastQuestionForStudent = asked.length >= QUESTIONS_PER_STUDENT;
      nextBtn.textContent = "Next";
      nextBtn.onclick = function () {
        go(function () {
          state.awaitingContinue = false;
          state.pendingTurn = null;
          if (isLastQuestionForStudent) state.phase = "notepad";
        });
      };
      row.appendChild(nextBtn);
      panel.appendChild(row);
      main.appendChild(panel);
      renderGameLayout(main);
      return;
    }

    if (asked.length >= QUESTIONS_PER_STUDENT) {
      var doneTitle = document.createElement("div");
      doneTitle.className = "panel-title";
      doneTitle.textContent = "You've already learned everything you can here.";
      panel.appendChild(doneTitle);

      var doneText = document.createElement("div");
      doneText.className = "intro-text";
      doneText.textContent = "You asked " + student.name + " everything on your list. Head back or pick someone else to continue the investigation.";
      panel.appendChild(doneText);

      var doneBtnRow = document.createElement("div");
      doneBtnRow.className = state.history.length ? "btn-row split" : "btn-row";
      if (state.history.length) {
        var backBtn2 = document.createElement("button");
        backBtn2.type = "button";
        backBtn2.className = "btn-secondary";
        backBtn2.textContent = "Back";
        backBtn2.onclick = goBack;
        doneBtnRow.appendChild(backBtn2);
      }
      var chooseBtn = document.createElement("button");
      chooseBtn.type = "button";
      chooseBtn.className = "btn-primary";
      chooseBtn.textContent = "Choose Someone Else";
      chooseBtn.onclick = function () {
        var remaining = STUDENTS.filter(function (s) { return !isFullyAsked(s.name); });
        go(function () {
          state.phase = remaining.length === 0 ? "guessing" : "select";
        });
      };
      doneBtnRow.appendChild(chooseBtn);
      panel.appendChild(doneBtnRow);

      main.appendChild(panel);
      renderGameLayout(main);
      return;
    }

    var title = document.createElement("div");
    title.className = "panel-title";
    title.textContent = "Which question do you want to ask?";
    panel.appendChild(title);

    var choiceList = document.createElement("div");
    choiceList.className = "choice-list";

    QUESTION_BANK.forEach(function (pair) {
      var qid = pair[0], qtext = pair[1];
      if (asked.indexOf(qid) !== -1) return;
      var optBtn = document.createElement("button");
      optBtn.type = "button";
      optBtn.className = "choice-card" + (state.selectedQid === qid ? " selected" : "");
      optBtn.textContent = qtext;
      optBtn.onclick = function () {
        state.selectedQid = qid;
        render();
      };
      choiceList.appendChild(optBtn);
    });
    panel.appendChild(choiceList);

    var btnRow = document.createElement("div");
    btnRow.className = state.history.length ? "btn-row split" : "btn-row";
    if (state.history.length) {
      var backBtn = document.createElement("button");
      backBtn.type = "button";
      backBtn.className = "btn-secondary";
      backBtn.textContent = "Back";
      backBtn.onclick = goBack;
      btnRow.appendChild(backBtn);
    }
    var nextBtn2 = document.createElement("button");
    nextBtn2.type = "button";
    nextBtn2.className = "btn-primary";
    nextBtn2.textContent = "Next";
    nextBtn2.disabled = !state.selectedQid;
    nextBtn2.onclick = function () {
      if (!state.selectedQid) return;
      var qid = state.selectedQid;
      var qtext = QUESTION_BANK.filter(function (p) { return p[0] === qid; })[0][1];
      var answer = randomChoice(state.personas[student.name].responses[qid]);
      state.askedIds[student.name].push(qid);
      state.conversation[student.name].push({ q: qtext, a: answer });
      state.selectedQid = null;
      state.awaitingContinue = true;
      state.pendingTurn = { q: qtext, a: answer };
      render();
    };
    btnRow.appendChild(nextBtn2);
    panel.appendChild(btnRow);

    main.appendChild(panel);
    renderGameLayout(main);
  }

  // -------------------------------------------------------------------------
  // Select - chapter-select screen shown after finishing a student, letting
  // the player pick who to interview next instead of a forced order.
  // -------------------------------------------------------------------------

  function renderSelect() {
    var main = document.createElement("div");
    main.className = "game-main";

    var title = document.createElement("div");
    title.className = "panel-title";
    title.textContent = "Choose who to interview next";
    main.appendChild(title);

    var remainingIdx = STUDENTS
      .map(function (s, i) { return i; })
      .filter(function (i) { return !isFullyAsked(STUDENTS[i].name); });

    if (remainingIdx.length === 0) {
      var doneMsg = document.createElement("div");
      doneMsg.className = "intro-text";
      doneMsg.textContent = "You've interviewed everyone. Time to make your final call.";
      main.appendChild(doneMsg);

      var proceedRow = document.createElement("div");
      proceedRow.className = "btn-row center";
      var proceedBtn = document.createElement("button");
      proceedBtn.type = "button";
      proceedBtn.className = "btn-primary";
      proceedBtn.textContent = "Proceed to Final Guesses";
      proceedBtn.onclick = function () {
        go(function () { state.phase = "guessing"; });
      };
      proceedRow.appendChild(proceedBtn);
      main.appendChild(proceedRow);

      renderGameLayout(main);
      return;
    }

    var intro = document.createElement("div");
    intro.className = "intro-text";
    intro.textContent = remainingIdx.length + " of " + STUDENTS.length + " left to interview. Pick anyone.";
    main.appendChild(intro);

    var grid = document.createElement("div");
    grid.className = "cast-grid";

    remainingIdx.forEach(function (idx) {
      var student = STUDENTS[idx];
      var card = document.createElement("div");
      card.className = "cast-card";
      card.onclick = function () { goToStudent(idx, true); };

      var portrait = makePortraitEl(idx, student.name, "big");
      var badge = document.createElement("span");
      badge.className = "cast-badge";
      badge.textContent = "Suspect #0" + (idx + 1);
      portrait.appendChild(badge);

      var hoverPlay = document.createElement("div");
      hoverPlay.className = "cast-hover-play";
      hoverPlay.innerHTML = '<span>' + PLAY_ICON + ' Interview</span>';
      portrait.appendChild(hoverPlay);

      card.appendChild(portrait);

      var info = document.createElement("div");
      info.className = "cast-info";
      info.innerHTML =
        '<div class="cast-name">' + escapeHtml(student.name) + '</div>' +
        '<div class="cast-class">' + escapeHtml(student.className) + '</div>' +
        '<div class="cast-teaser">' + escapeHtml(student.background) + '</div>';
      card.appendChild(info);

      grid.appendChild(card);
    });

    main.appendChild(grid);
    renderGameLayout(main);
  }

  // -------------------------------------------------------------------------
  // Notepad - quick "what do you think so far?" prompt shown right after a
  // student's 3rd question, saved per student and recalled on the guess
  // screen as a reminder.
  // -------------------------------------------------------------------------

  function renderNotepad() {
    var main = document.createElement("div");
    main.className = "game-main";

    var student = currentStudent();
    if (!state.notes[student.name]) state.notes[student.name] = { guess: null, text: "" };
    var note = state.notes[student.name];

    var speakerRow = document.createElement("div");
    speakerRow.className = "speaker-row";
    speakerRow.appendChild(makePortraitEl(state.studentIdx, student.name, "small"));
    var speakerText = document.createElement("div");
    speakerText.innerHTML =
      '<div class="speaker-name">' + escapeHtml(student.name) + '</div>' +
      '<div class="speaker-class">' + escapeHtml(student.className) + '</div>';
    speakerRow.appendChild(speakerText);
    main.appendChild(speakerRow);

    var panel = document.createElement("div");
    panel.className = "panel-card";

    var title = document.createElement("div");
    title.className = "panel-title";
    title.textContent = "What do you think so far?";
    panel.appendChild(title);

    var quickRow = document.createElement("div");
    quickRow.className = "guess-toggle";
    quickRow.style.marginBottom = "16px";
    [
      { label: "AI", value: true },
      { label: "Not AI", value: false },
      { label: "Unsure", value: null }
    ].forEach(function (opt) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "toggle-pill" + (note.guess === opt.value ? " selected" : "");
      btn.textContent = opt.label;
      btn.onclick = function () {
        note.guess = opt.value;
        render();
      };
      quickRow.appendChild(btn);
    });
    panel.appendChild(quickRow);

    var textarea = document.createElement("textarea");
    textarea.className = "notepad-textarea";
    textarea.placeholder = "Jot down anything that stood out - word choice, weird pauses, anything...";
    textarea.value = note.text;
    textarea.oninput = function () { note.text = textarea.value; };
    panel.appendChild(textarea);

    var hint = document.createElement("div");
    hint.className = "notepad-hint";
    hint.textContent = "You'll see this note again on the final guess screen.";
    panel.appendChild(hint);

    var btnRow = document.createElement("div");
    btnRow.className = "btn-row";
    btnRow.style.marginTop = "18px";
    var continueBtn = document.createElement("button");
    continueBtn.type = "button";
    continueBtn.className = "btn-primary";
    continueBtn.textContent = "Save & Continue";
    continueBtn.onclick = function () {
      var remaining = STUDENTS.filter(function (s) { return !isFullyAsked(s.name); });
      go(function () {
        state.phase = remaining.length === 0 ? "guessing" : "select";
      });
    };
    btnRow.appendChild(continueBtn);
    panel.appendChild(btnRow);

    main.appendChild(panel);
    renderGameLayout(main);
  }

  // -------------------------------------------------------------------------
  // Guessing
  // -------------------------------------------------------------------------

  function renderGuessing() {
    var shell = document.createElement("div");
    shell.className = "reader-shell";

    var title = document.createElement("div");
    title.className = "panel-title";
    title.style.marginBottom = "6px";
    title.textContent = "Final section: who was AI?";
    shell.appendChild(title);

    var intro = document.createElement("div");
    intro.className = "intro-text";
    intro.textContent = "For each classmate, mark whether you think they were AI-powered or not. Your notes from the interrogation are shown as a reminder.";
    shell.appendChild(intro);

    STUDENTS.forEach(function (student, index) {
      var card = document.createElement("div");
      card.className = "guess-card";

      var top = document.createElement("div");
      top.className = "guess-row";

      var nameRow = document.createElement("div");
      nameRow.className = "guess-name-row";
      nameRow.appendChild(makePortraitEl(index, student.name, "small"));
      var nameBlock = document.createElement("div");
      nameBlock.innerHTML =
        '<div class="guess-name">' + escapeHtml(student.name) + '</div>' +
        '<div class="guess-class">' + escapeHtml(student.className) + '</div>';
      nameRow.appendChild(nameBlock);
      top.appendChild(nameRow);

      var toggle = document.createElement("div");
      toggle.className = "guess-toggle";
      var currentGuess = state.guesses[student.name];

      var notAiBtn = document.createElement("button");
      notAiBtn.type = "button";
      notAiBtn.className = "toggle-pill" + (currentGuess === false ? " selected" : "");
      notAiBtn.textContent = "Not AI";
      notAiBtn.onclick = function () {
        state.guesses[student.name] = false;
        render();
      };
      toggle.appendChild(notAiBtn);

      var aiBtn = document.createElement("button");
      aiBtn.type = "button";
      aiBtn.className = "toggle-pill" + (currentGuess === true ? " selected" : "");
      aiBtn.textContent = "AI";
      aiBtn.onclick = function () {
        state.guesses[student.name] = true;
        render();
      };
      toggle.appendChild(aiBtn);

      top.appendChild(toggle);
      card.appendChild(top);

      var note = state.notes[student.name];
      if (note) {
        var guessLabel = note.guess === true ? "AI" : note.guess === false ? "Not AI" : "Unsure";
        var recall = document.createElement("div");
        recall.className = "guess-recall";
        recall.innerHTML =
          '<span class="guess-recall-tag">Your first read: <strong>' + guessLabel + '</strong></span>' +
          (note.text
            ? '<div class="guess-recall-note">&ldquo;' + escapeHtml(note.text) + '&rdquo;</div>'
            : '<div class="guess-recall-note empty">No notes taken.</div>');
        card.appendChild(recall);
      }

      var expanded = !!state.guessExpanded[student.name];
      var toggleAnswersBtn = document.createElement("button");
      toggleAnswersBtn.type = "button";
      toggleAnswersBtn.className = "btn-secondary btn-mini";
      toggleAnswersBtn.textContent = expanded ? "Hide Answers" : "View Answers";
      toggleAnswersBtn.onclick = function () {
        state.guessExpanded[student.name] = !expanded;
        render();
      };
      card.appendChild(toggleAnswersBtn);

      if (expanded) {
        var qaList = document.createElement("div");
        qaList.className = "guess-qa-list";
        state.conversation[student.name].forEach(function (turn) {
          var qa = document.createElement("div");
          qa.className = "review-qa";
          qa.innerHTML =
            '<div class="review-q">Q: ' + escapeHtml(turn.q) + '</div>' +
            '<div class="review-a">' + escapeHtml(turn.a) + '</div>';
          qaList.appendChild(qa);
        });
        card.appendChild(qaList);
      }

      shell.appendChild(card);
    });

    var markedCount = STUDENTS.filter(function (s) {
      return state.guesses.hasOwnProperty(s.name);
    }).length;

    var btnRow = document.createElement("div");
    btnRow.className = "btn-row center";
    btnRow.style.marginTop = "22px";
    var submitBtn = document.createElement("button");
    submitBtn.type = "button";
    submitBtn.className = "btn-primary";
    submitBtn.textContent = "Submit Answers";
    submitBtn.disabled = markedCount < STUDENTS.length;
    submitBtn.onclick = function () {
      if (markedCount < STUDENTS.length) return;
      var summary = evaluate(STUDENTS, state.guesses, state.personas);
      go(function () {
        if (!state.statsRecorded) {
          recordGameResult(summary);
          state.statsRecorded = true;
        }
        state.phase = "reveal";
      });
    };
    btnRow.appendChild(submitBtn);
    shell.appendChild(btnRow);

    if (markedCount < STUDENTS.length) {
      var note2 = document.createElement("div");
      note2.className = "guess-note";
      note2.textContent = markedCount + " of " + STUDENTS.length + " answered - mark everyone before submitting.";
      shell.appendChild(note2);
    }

    appInner.appendChild(shell);
  }

  // -------------------------------------------------------------------------
  // Reveal
  // -------------------------------------------------------------------------

  function renderReveal() {
    var shell = document.createElement("div");
    shell.className = "reader-shell";

    var summary = evaluate(STUDENTS, state.guesses, state.personas);

    var scoreHero = document.createElement("div");
    scoreHero.className = "score-hero";
    scoreHero.innerHTML =
      '<span class="score-num">' + summary.correct + '</span><span class="score-of"> / ' + summary.total + '</span>';
    shell.appendChild(scoreHero);

    var verdict = document.createElement("div");
    verdict.className = "verdict-text";
    verdict.textContent = summary.verdict;
    shell.appendChild(verdict);

    summary.results.forEach(function (result) {
      var row = document.createElement("div");
      row.className = "result-row";

      var head = document.createElement("div");
      head.className = "result-head";
      head.innerHTML =
        '<span class="result-name">' + escapeHtml(result.name) + '</span>' +
        '<span class="' + (result.correct ? "result-tag-correct" : "result-tag-incorrect") + '">' +
        (result.correct ? "Correct" : "Incorrect") + '</span>';
      row.appendChild(head);

      var detail = document.createElement("div");
      detail.className = "result-detail";
      detail.textContent = "Actually: " + (result.actuallyAI ? "AI-powered" : "Not AI") +
        "  |  Your answer: " + (result.guessedAI ? "AI-powered" : "Not AI");
      row.appendChild(detail);

      var tellsBlock = document.createElement("div");
      tellsBlock.className = "result-tells";
      if (result.actuallyAI) {
        var items = result.tells.map(function (t) {
          return "<li>" + escapeHtml(t) + "</li>";
        }).join("");
        tellsBlock.innerHTML = "Tells you could have caught:<ul>" + items + "</ul>";
      } else {
        tellsBlock.textContent = "No red flags - consistent personality, grounded verifiable details.";
      }
      row.appendChild(tellsBlock);

      shell.appendChild(row);
    });

    var btnRow = document.createElement("div");
    btnRow.className = "btn-row center";
    btnRow.style.marginTop = "20px";

    var reviewBtn = document.createElement("button");
    reviewBtn.type = "button";
    reviewBtn.className = "btn-secondary";
    reviewBtn.textContent = "Review Answers";
    reviewBtn.onclick = function () {
      go(function () {
        state.phase = "review";
      });
    };
    btnRow.appendChild(reviewBtn);

    var again = document.createElement("button");
    again.type = "button";
    again.className = "btn-primary";
    again.textContent = "Retake Quiz";
    again.onclick = function () {
      go(function () {
        state = freshState();
      });
    };
    btnRow.appendChild(again);
    shell.appendChild(btnRow);

    appInner.appendChild(shell);
  }

  // -------------------------------------------------------------------------
  // Review
  // -------------------------------------------------------------------------

  function renderReview() {
    var shell = document.createElement("div");
    shell.className = "reader-shell";

    var title = document.createElement("div");
    title.className = "panel-title";
    title.style.marginBottom = "6px";
    title.textContent = "Review Answers";
    shell.appendChild(title);

    var intro = document.createElement("div");
    intro.className = "intro-text";
    intro.textContent = "Every question you asked and how each classmate responded.";
    shell.appendChild(intro);

    STUDENTS.forEach(function (student, index) {
      var item = document.createElement("div");
      item.className = "review-item";

      var head = document.createElement("div");
      head.className = "review-item-head";
      head.appendChild(makePortraitEl(index, student.name, "small"));
      var nameBlock = document.createElement("div");
      nameBlock.innerHTML =
        '<div class="review-name">' + escapeHtml(student.name) + '</div>' +
        '<span class="guess-class">' + escapeHtml(student.className) + '</span>';
      head.appendChild(nameBlock);
      item.appendChild(head);

      var convo = state.conversation[student.name];
      convo.forEach(function (turn) {
        var qa = document.createElement("div");
        qa.className = "review-qa";
        qa.innerHTML =
          '<div class="review-q">Q: ' + escapeHtml(turn.q) + '</div>' +
          '<div class="review-a">' + escapeHtml(turn.a) + '</div>';
        item.appendChild(qa);
      });

      shell.appendChild(item);
    });

    var btnRow = document.createElement("div");
    btnRow.className = "btn-row center";
    btnRow.style.marginTop = "20px";

    var backBtn = document.createElement("button");
    backBtn.type = "button";
    backBtn.className = "btn-secondary";
    backBtn.textContent = "Back to Results";
    backBtn.onclick = function () {
      go(function () {
        state.phase = "reveal";
      });
    };
    btnRow.appendChild(backBtn);

    var again = document.createElement("button");
    again.type = "button";
    again.className = "btn-primary";
    again.textContent = "Retake Quiz";
    again.onclick = function () {
      go(function () {
        state = freshState();
      });
    };
    btnRow.appendChild(again);
    shell.appendChild(btnRow);

    appInner.appendChild(shell);
  }

  render();
})();
</script>
</body>
</html>
